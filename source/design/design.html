/* ============================================================
 * Build Journey
 * ============================================================ */
function buildJourney(){
  PHASES.forEach((phase, pIdx)=>{
    const seg = document.createElement('div');
    seg.className = 'journey-segment';
    const label = document.createElement('div');
    label.className = 'segment-label';
    label.textContent = phase.label;
    seg.appendChild(label);
    const nodesWrap = document.createElement('div');
    nodesWrap.className = 'segment-nodes';
    phase.moduleIds.forEach((mid, i)=>{
      const mod = MODULES.find(m=>m.id===mid);
      const node = document.createElement('div');
      node.className = 'j-node' + (mod.status==='pending' ? ' is-pending' : '');
      node.dataset.id = mid;
      node.setAttribute('role','button');
      node.setAttribute('tabindex','0');
      node.dataset.tooltip = mod.status==='pending' ? (mod.title+'（开发中）') : mod.title;
      const dot = document.createElement('div');
      dot.className = 'j-dot';
      dot.textContent = mod.number;
      const title = document.createElement('div');
      title.className = 'j-title';
      title.textContent = mod.short || mod.title;
      node.appendChild(dot); node.appendChild(title);
      nodesWrap.appendChild(node);
      nodeEls[mid] = node;
      node.addEventListener('click', ()=>onNodeClick(mid));
      node.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onNodeClick(mid);} });
      if(i < phase.moduleIds.length-1){
        const link = document.createElement('div');
        link.className = 'j-link';
        link.dataset.from = mid;
        nodesWrap.appendChild(link);
      }
    });
    seg.appendChild(nodesWrap);
    track.appendChild(seg);
    if(pIdx < PHASES.length-1){
      const div = document.createElement('div');
      div.className = 'journey-divider';
      track.appendChild(div);
    }
  });
}

/* ============================================================
 * Node click
 * ============================================================ */
function onNodeClick(id){
  const mod = MODULES.find(m=>m.id===id);
  if(mod.status==='pending'){
    pauseAutoPlay();
    showNodeHint(id);
    return;
  }
  pauseAutoPlay();
  goToModule(id);
}

function showNodeHint(id){
  const node = nodeEls[id];
  if(!node) return;
  var evt = new MouseEvent('mouseover', { bubbles:true, cancelable:true, view:window });
  node.dispatchEvent(evt);
}

/* ============================================================
 * Module render
 * ============================================================ */
function goToModule(id, withAnim=true){
  const mod = MODULES.find(m=>m.id===id);
  if(!mod) return;
  const render = ()=>{
    currentId = id;
    updateJourneyStates();
    renderHeader(mod);
    renderLeftContent(mod);
    renderArtifact(mod);
    renderNav(mod);
    positionPlayheadAtCurrent();
  };
  if(withAnim && !REDUCED_MOTION){
    pjModule.classList.add('switching');
    setTimeout(()=>{
      render();
      pjModule.classList.remove('switching');
      pjModule.classList.add('entering');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ pjModule.classList.remove('entering'); }); });
    }, 230);
  } else {
    render();
  }
}

function updateJourneyStates(){
  MODULES.forEach(m=>{
    const node = nodeEls[m.id];
    if(!node) return;
    node.classList.remove('is-current','is-done');
    if(m.id===currentId){ node.classList.add('is-current'); }
    else if(m.status==='ready' && m.id < currentId){ node.classList.add('is-done'); }
  });
  // link done state
  document.querySelectorAll('.j-link').forEach(l=>{
    const from = parseInt(l.dataset.from,10);
    l.classList.toggle('is-done', from < currentId && MODULES.find(m=>m.id===from).status==='ready');
  });
}

function renderAgentArchitecture(body, mod){
  const nodes = [
    { en:"INPUT", zh:"输入层", detail:"用户输入 · 查询语句" },

    { en:"QUERY", zh:"知识查询层", detail:"GraphQueryAgent 图查询执行" },
    { en:"EVIDENCE", zh:"证据加工层", detail:"EvidenceAgent 证据标准化 · RiskAgent 风险标记" },
    { en:"OUTPUT", zh:"输出层", detail:"ResponseAgent 回复生成" }
  ];
  const x=28, w=212, h=88, gap=26, top0=12;
  const cx = x + w/2;
  let svg = '<svg class="agent-flow" viewBox="0 0 400 690" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Agent 架构图：主流程 INPUT 到 OUTPUT，Boundary 为旁路">';
  nodes.forEach((n,i)=>{
    if(i < nodes.length-1){
      const y1 = top0 + i*(h+gap) + h;
      const y2 = top0 + (i+1)*(h+gap);
      svg += '<line class="agent-flow__line" x1="'+cx+'" y1="'+y1+'" x2="'+cx+'" y2="'+y2+'"/>';
    }
  });
  nodes.forEach((n,i)=>{
    const y = top0 + i*(h+gap);
    const lines = (n.detail.indexOf('Agent') !== -1) ? n.detail.split(' · ') : [n.detail];
    let detailSvg = '';
    lines.forEach((ln, k)=>{
      detailSvg += '<text class="agent-flow__detail" x="'+(x+14)+'" y="'+(y+60+k*20)+'">'+ln+'</text>';
    });
    svg += '<g class="agent-flow__node"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10"/>'+
      '<text class="agent-flow__en" x="'+(x+14)+'" y="'+(y+21)+'">'+n.en+'</text>'+
      '<text class="agent-flow__zh" x="'+(x+14)+'" y="'+(y+42)+'">'+n.zh+'</text>'+
      detailSvg+'</g>';
  });
  // Boundary 旁路（从 SEMANTIC 条件触发，直接返回响应，不接回主流程）
  const semTop = top0 + 1*(h+gap);
  const bX=262, bY=semTop + (h+gap), bW=128, bH=88;
  const semEdgeX = x + w;
  const semMidY = semTop + h/2;
  const bTopCx = bX + bW/2;
  svg += '<path class="agent-flow__dash" d="M'+semEdgeX+' '+semMidY+' H'+(semEdgeX+12)+' V'+(bY-14)+' H'+bTopCx+' V'+bY+'"/>';
  svg += '<g class="agent-flow__boundary"><rect x="'+bX+'" y="'+bY+'" width="'+bW+'" height="'+bH+'" rx="10"/>'+

function renderEngineeringNarrative(mod){

    thinkingCol.appendChild(sec);

    return '<div class="m07-sub'+(plain?' m07-sub--plain':'')+'">'+

      (desc?'<div class="m07-sub__desc">'+desc+'</div>':'')+

  // 1. PROCESS · 开发流程（标题+引导段=杏色带，01/02/03 内容=白色带）
  const pBody = renderEngImplements(eng.implements)
    + renderEngSchedule(eng.schedule)
    + renderEngIntegrate(eng.integrate);
  section('PROCESS · 开发流程', intro(eng.concept), pBody);

    + sub('部署与运维','', renderM07Ops(tp.ops), true);
  section('TECH STACK · 技术包选型', intro(eng.techIntro), tBody);

  // 3. KEY INSIGHT 恢复默认 key-decision 渲染（已取消 engineering 跳过）
}

function renderM07Ops(ops){
  if(!ops) return '';
  const card = (n, extra) => '<div class="m07-pipe__node'+(extra?' '+extra:'')+'">'+
    '<span class="m07-pipe__name">'+n.name+'</span>'+
    '<span class="m07-pipe__d">'+n.d+'</span></div>';
  const vdown = '<div class="m07-pipe__vdown">↓</div>';
  let h = '<div class="m07-pipe">';
  (ops.mainNodes||[]).forEach((n,i)=>{
    if(i === 1 && ops.aux){
      h += '<div class="m07-pipe__row">'+card(n)+
        '<div class="m07-pipe__arrow">→</div>'+
        card(ops.aux,'m07-pipe__node--aux')+'</div>';
    } else {
      h += card(n);
    }
    if(i < ops.mainNodes.length-1) h += vdown;
  });
  h += '</div>';
  return h;
}

function buildBlock(b){
  const frag = document.createDocumentFragment();
  const title = document.createElement('p');
  title.className = 't-block__title';
  title.textContent = b.title;
  frag.appendChild(title);

  if(b.kind==='start'){
    const idx = document.createElement('div');
    idx.className = 't-start__idx';
    idx.textContent = b.idx;
    const body = document.createElement('div');
    body.className = 't-block__body';
    body.textContent = b.text;
    const note = document.createElement('div');
    note.className = 't-block__body';
    note.style.color = 'var(--c-text-secondary)';
    note.style.fontSize = '13px';
    note.style.marginTop = 'var(--s2)';
    note.textContent = b.note;
    const accent = document.createElement('div');
    accent.className = 't-start__accent';
    accent.textContent = b.accent;
    frag.append(idx, body, note, accent);
  }
  else if(b.kind==='noticed'){
    const body = document.createElement('div');
    body.className = 't-block__body';
    body.textContent = b.text;
    const points = document.createElement('div');
    points.className = 't-noticed__points';
    const pointItems = b.points || [];
    const leadPoints = pointItems.slice(0, -1);
    const lastPoint = pointItems[pointItems.length - 1];
    leadPoints.forEach(p=>{
      const pe = document.createElement('div');
      pe.className = 't-point';
      pe.textContent = p;
      points.appendChild(pe);
    });
    const note = document.createElement('div');
    note.className = 't-block__body';
    note.style.color = 'var(--c-text-secondary)';
    note.style.fontSize = '13px';
    note.style.marginTop = 'var(--s2)';
    note.style.marginBottom = 'var(--s3)';
    note.textContent = b.note || '';
    const lastPointEl = document.createElement('div');
    lastPointEl.className = 't-point';
    lastPointEl.textContent = lastPoint || '';
    const hl = document.createElement('div');
    hl.className = 't-highlight';
    hl.textContent = b.highlight;
    frag.append(body, points);
    if(b.note) frag.appendChild(note);
    if(lastPoint) frag.appendChild(lastPointEl);
    if(b.accent){
      const accentList = Array.isArray(b.accent) ? b.accent : [b.accent];
      accentList.forEach(txt=>{
        const accent = document.createElement('div');
        accent.className = 't-start__accent';
        accent.textContent = txt;
        frag.appendChild(accent);
      });
    }
    frag.appendChild(hl);
  }
  else if(b.kind==='whyfip'){
    b.decisions.forEach(d=>{
      const row = document.createElement('div');
      row.className = 't-decision';
      row.innerHTML = '<div class="t-decision__idx">'+d.idx+'</div>'+
        '<div><div class="t-decision__tag">'+d.tag+' / '+d.t+'</div>'+
        '<div class="t-decision__desc">'+d.d+'</div></div>';
      frag.appendChild(row);
    });
    const kd = document.createElement('div');
    kd.className = 'key-decision';
    kd.innerHTML = '<strong>KEY DECISION</strong><br>'+b.keyDecision;
    frag.appendChild(kd);
  }
  else if(b.kind==='validate-problem'){
    const idx = document.createElement('div');
    idx.className = 't-start__idx';
    idx.textContent = b.idx;
    const en = document.createElement('div');
    en.className = 't-block__en';
    en.textContent = b.en;
    const sub = document.createElement('h4');
    sub.className = 't-block__subtitle';
    sub.textContent = b.title;
    const body = document.createElement('div');
    body.className = 't-block__body';
    body.textContent = b.text;
    const qs = document.createElement('ul');
    qs.className = 't-question-list';
    (b.questions || []).forEach(q=>{
      const li = document.createElement('li');
      li.textContent = q;
      qs.appendChild(li);
    });
    const signalBox = document.createElement('div');
    signalBox.className = 't-signal-box';
    const signalTitle = document.createElement('div');
    signalTitle.className = 't-signal-box__title';
    signalTitle.textContent = '调研中呈现出的需求信号';
    signalBox.appendChild(signalTitle);
    b.signals.forEach(s=>{
      const row = document.createElement('div');
      row.className = 't-signal-row';
      const label = document.createElement('span');
      label.className = 't-signal-row__label';
      label.textContent = s.label;
      const track = document.createElement('div');
      track.className = 't-signal-row__track';
      const fillCount = s.level==='强'?10 : s.level==='明确'?7 : 5;
      for(let i=0;i<10;i++){
        const seg = document.createElement('div');
        seg.className = 't-signal-seg' + (i<fillCount?' is-filled':'');
        track.appendChild(seg);
      }
      const level = document.createElement('span');
      level.className = 't-signal-row__level';
      level.textContent = s.level;
      row.append(label, track, level);
      signalBox.appendChild(row);
    });
    const signalNote = document.createElement('div');
    signalNote.className = 't-signal-box__note';
    signalNote.textContent = b.signalNote;
    signalBox.appendChild(signalNote);
    frag.append(idx, en, sub, body, qs, signalBox);
  }
  else if(b.kind==='discover-need'){
    const idx = document.createElement('div');
    idx.className = 't-start__idx';
    idx.textContent = b.idx;
    const en = document.createElement('div');
    en.className = 't-block__en';
    en.textContent = b.en;
    const sub = document.createElement('h4');
    sub.className = 't-block__subtitle';
    sub.textContent = b.title;
    const body = document.createElement('div');
    body.className = 't-block__body';
    body.textContent = b.text || '';
    const flow = document.createElement('div');
    flow.className = 't-flow-chain';
    b.flow.forEach((f,i)=>{
      const item = document.createElement('span');
      item.className = 't-flow-chain__item';
      item.textContent = f;
      flow.appendChild(item);
      if(i < b.flow.length-1){
        const arrow = document.createElement('span');
        arrow.className = 't-flow-chain__arrow';
        arrow.textContent = '→';
        flow.appendChild(arrow);
      }
    });
    const pairs = document.createElement('div');
    pairs.className = 't-quote-pairs';
    b.pairs.forEach(p=>{
      const item = document.createElement('div');
      item.className = 't-quote-pair';
      item.innerHTML = '<div class="t-quote-pair__quote">“'+p.quote+'”</div>'+
        '<div class="t-quote-pair__need">'+p.need+'</div>';
      pairs.appendChild(item);
    });
    frag.append(idx, en, sub, body, flow, pairs);
  }
  else if(b.kind==='recalibrate'){
    const idx = document.createElement('div');
    idx.className = 't-start__idx';
    idx.textContent = b.idx;
    const en = document.createElement('div');
    en.className = 't-block__en';
    en.textContent = b.en;
    const sub = document.createElement('h4');
    sub.className = 't-block__subtitle';
    sub.textContent = b.title;
    const body = document.createElement('div');
    body.className = 't-block__body';
    body.textContent = b.text;
    const cases = document.createElement('div');
    cases.className = 't-cases';
    b.cases.forEach(c=>{
      const item = document.createElement('div');
      item.className = 't-case';
      item.innerHTML = '<div class="t-case__before"><span class="t-case__tag">BEFORE</span>'+c.before+'</div>'+
        '<div class="t-case__after"><span class="t-case__tag">AFTER</span>'+c.after+'</div>'+
        '<div class="t-case__decision"><span class="t-case__tag">DECISION</span>'+c.decision+'</div>';
      cases.appendChild(item);
    });
    const insight = document.createElement('div');
    insight.className = 't-key-insight';
    insight.textContent = b.insight;
    frag.append(idx, en, sub, body, cases, insight);
  }
  else if(b.kind==='principle'){
    const loop = document.createElement('div');
    loop.className = 't-loop';
    b.loop.forEach(l=>{
      const item = document.createElement('div');
      item.className = 't-loop__item';
      item.innerHTML = '<div class="t-loop__tag">'+l.tag+'</div><div class="t-loop__desc">'+l.d+'</div>';
      loop.appendChild(item);
    });
    frag.appendChild(loop);
    const note = document.createElement('div');
    note.className = 't-note t-note--loop';
    note.textContent = '能力闭环：Answer → Explain → Verify';
    frag.appendChild(note);
  }
  else if(b.kind==='parts'){
    b.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 't-parts__item';
      row.innerHTML = '<div class="t-parts__idx">'+it.idx+'</div>'+
        '<div><div class="t-parts__tag">'+it.tag+'</div><div class="t-parts__desc">'+it.d+'</div></div>';
      frag.appendChild(row);
    });
    if(b.note){
      const note = document.createElement('div');
      note.className = 't-note t-note--loop';
      note.textContent = b.note;
      frag.appendChild(note);
    }
  }
  else if(b.kind==='decisions'){
    b.items.forEach(it=>{
      const q = document.createElement('div');
      q.className = 't-decision-q';
      q.textContent = it.q;
      const a = document.createElement('div');
      a.className = 't-decision-a';
      a.textContent = it.a;
      frag.append(q, a);
    });
  }
  else if(b.kind==='decision-tree'){
    const prob = document.createElement('div');
    prob.className = 'dt-problem';
    prob.innerHTML = '<div class="dt-problem__title">Objectives</div><div class="dt-problem__body">'+b.problem+'</div>';
    if(b.objectives && b.objectives.length){
      const objList = document.createElement('div');
      objList.className = 'dt-objectives';
      b.objectives.forEach(o=>{
        const item = document.createElement('div');
        item.className = 'dt-objective';
        item.innerHTML = '<span class="dt-objective__dot">•</span><span class="dt-objective__text"><strong>'+o.title+'：</strong>'+o.desc+'</span>';
        objList.appendChild(item);
      });
      prob.appendChild(objList);
    }
    frag.appendChild(prob);
    const tag = document.createElement('div');
    tag.className = 'dt-tag';
    tag.textContent = 'OPTIONS · 为什么这样决策';
    frag.appendChild(tag);
    const opts = document.createElement('div');
    opts.className = 'dt-options';
    b.options.forEach(o=>{
      const op = document.createElement('div');
      op.className = 'dt-option' + (o.chosen ? ' is-chosen' : '');
      const v = document.createElement('div');
      v.className = 'dt-verdict ' + (o.chosen ? 'dt-verdict--ok' : 'dt-verdict--x');
      v.textContent = o.verdict;
      const main = document.createElement('div');
      main.className = 'dt-option__main';
      let html = '<div class="dt-option__head"><span class="dt-option__tag">'+o.tag+'</span><span class="dt-option__name">'+o.name+'</span></div>'+
        '<div class="dt-option__reason">'+o.reason+'</div>';
      if(o.decompose){
        html += '<div class="dt-decompose"><div class="dt-decompose__title">OPTION C · 拆解为三个部分</div>';
        o.decompose.forEach(p=>{
          html += '<div class="dt-part"><span class="dt-part__idx">'+p.idx+'</span><span class="dt-part__tag">'+p.tag+'</span><span class="dt-part__d">'+p.d+'</span></div>';
        });
        if(o.note) html += '<div class="dt-decompose__note">'+o.note+'</div>';
        html += '</div>';
      }
      main.innerHTML = html;
      op.append(v, main);
      opts.appendChild(op);
    });
    frag.appendChild(opts);
  }
  else if(b.kind==='directions'){
    const wrap = document.createElement('div');
    wrap.className = 't-dirs';
    b.dirs.forEach(d=>{
      const el = document.createElement('div');
      el.className = 't-dir' + (d.state==='selected' ? ' t-dir--on' : ' t-dir--off');
      el.innerHTML = '<div class="t-dir__tag">'+d.tag+'</div>'+
        '<div class="t-dir__name">'+d.name+'</div>'+
        '<div class="t-dir__desc">'+d.desc+'</div>'+
        '<div class="t-dir__note">'+d.note+'</div>'+
        (d.state==='selected' ? '<div class="t-dir__sel">✓ SELECTED</div>' : '<div class="t-dir__mark">✕</div>');
      wrap.appendChild(el);
    });

  }
  else if(b.kind==='visual-directions'){

    cu.className = 'vd-usage reveal-item';
    let barHtml = '<div class="vd-usage__title">COLOR USAGE / 页面色彩比例</div>'+
      '<div class="vd-usage__bar">';
    b.colorUsage.forEach(u=>{
      const segCls = u.pct >= 50 ? 'vd-usage__seg vd-usage__seg--light' : 'vd-usage__seg vd-usage__seg--dark';
      barHtml += '<div class="'+segCls+'" style="width:'+u.pct+'%;background:'+u.c+'">'+
        '<span class="vd-usage__pct">'+u.pct+'%</span></div>';
    });
    barHtml += '</div><div class="vd-usage__legend">';
    b.colorUsage.forEach(u=>{
      barHtml += '<div class="vd-usage__item"><span class="vd-usage__dot" style="background:'+u.c+'"></span>'+
        '<span class="vd-usage__label"><b>'+u.label+'</b><i>'+u.sub+'</i></span></div>';
    });
    barHtml += '</div>';
    cu.innerHTML = barHtml;
    wrap.appendChild(cu);
    frag.appendChild(wrap);
  }
  else if(b.kind==='flow'){
    const fl = document.createElement('div');
    fl.className = 't-flow';
    b.steps.forEach((s,i)=>{
      const seg = document.createElement('span');
      seg.className = 't-flow__seg';
      seg.textContent = s;
      fl.appendChild(seg);
      if(i < b.steps.length-1){
        const ar = document.createElement('span');
        ar.className = 't-flow__arrow';
        ar.textContent = '→';
        fl.appendChild(ar);
      }
    });
    frag.appendChild(fl);
    if(b.note){
      const note = document.createElement('div');
      note.className = 't-note t-note--loop';
      note.textContent = b.note;
      frag.appendChild(note);
    }

  else if(b.kind==='rules'){
    b.cats.forEach(c=>{
      const row = document.createElement('div');
      row.className = 't-rule';
      row.innerHTML = '<div class="t-rule__tag">'+c.tag+'</div><div class="t-rule__desc">'+c.d+'</div>';
      frag.appendChild(row);
    });
    if(b.rel){
      const rel = document.createElement('div');
      rel.className = 't-note t-note--loop';
      rel.textContent = b.rel;
      frag.appendChild(rel);
    }
  }
  else if(b.kind==='result'){
    const stats = document.createElement('div');
    stats.className = 't-stats';
    b.stats.forEach(s=>{
      const el = document.createElement('div');
      el.className = 't-stat';
      el.innerHTML = '<div class="t-stat__k">'+s.k+'</div><div class="t-stat__d">'+s.d+'</div>';

    if(b.text){

      t.className = 't-block__body';
      t.style.marginTop = 'var(--s3)';
      t.style.color = 'var(--c-text-secondary)';
      t.style.fontSize = '13px';
      t.textContent = b.text;
      frag.appendChild(t);
    }
  }
  else if(b.kind==='questions'){
    b.qs.forEach(q=>{
      const el = document.createElement('div');
      el.className = 't-question';
      el.innerHTML = '<span class="t-question__q">Q</span><span class="t-question__text">'+q+'</span>';
      frag.appendChild(el);
    });
  }
  else if(b.kind==='pages'){
    b.pages.forEach(p=>{
      const el = document.createElement('div');
      el.className = 't-page';
      el.textContent = p;
      frag.appendChild(el);
    });
  }
  else if(b.kind==='dimensions'){
    b.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 't-dim';
      row.innerHTML = '<div class="t-dim__idx">'+it.idx+'</div>'+
        '<div><div class="t-dim__tag">'+it.tag+'</div><div class="t-dim__desc">'+it.d+'</div></div>';
      frag.appendChild(row);
    });

  else if(b.kind==='deliverables'){
    b.items.forEach(it=>{

      row.className = 't-deliv';
      row.innerHTML = '<div class="t-deliv__idx">'+it.idx+'</div>'+
        '<div><div class="t-deliv__tag">'+it.tag+'</div><div class="t-deliv__desc">'+it.d+'</div></div>';
      frag.appendChild(row);
    });
  }
  return frag;
}

/* ---------- Artifact renderers ---------- */
function renderArtifact(mod){
  if(ifaceTimer){ clearInterval(ifaceTimer); ifaceTimer = null; }
  if(mod.artifacts && Array.isArray(mod.artifacts)){
    renderAgentSystem(mod);
    return;
  }
  const a = mod.artifact;
  artifactCol.className = 'artifact' + (a.density ? ' artifact--'+a.density : '') + (a.subtype==='noise-to-insight' ? ' artifact--stepped' : '') + (a.subtype==='agent-flow' ? ' artifact--agent' : '');
  artifactCol.innerHTML = '';
  if(mod.status==='pending'){
    artifactCol.innerHTML = '<div class="pending-note">Artifact 开发中</div>';
    return;
  }
  const head = document.createElement('div');
  head.className = 'artifact__head';
  head.innerHTML = '<div><div class="artifact__name">'+a.name+'</div>'+
    '<div class="artifact__caption">'+a.caption+'</div></div>'+
    '<button class="artifact__expand" type="button">展开 ↗</button>';
  artifactCol.appendChild(head);
  if(a.subtype==='noise-to-insight'){
    const capDivider = document.createElement('div');
    capDivider.className = 'artifact__cap-divider';
    artifactCol.appendChild(capDivider);
  }
  const body = document.createElement('div');
  body.className = 'artifact__body';
  artifactCol.appendChild(body);

  if(a.subtype==='funnel') renderFunnel(body, a);
  else if(a.subtype==='matrix') renderMatrix(body, a);
  else if(a.subtype==='loop') renderBlueprint(body, a);
  else if(a.subtype==='gallery') renderGallery(body, a);
  else if(a.subtype==='architecture') renderArchitecture(body, a);
  else if(a.subtype==='interface') renderInterface(body, a);
  else if(a.subtype==='system') renderSystem(body, a);
  else if(a.subtype==='roadmap') renderRoadmap(body, a);
  else if(a.subtype==='frontend') renderFrontend(body, a);
  else if(a.subtype==='proof') renderProof(body, a);
  else if(a.subtype==='deployment') renderDeployment(body, a);
  else if(a.subtype==='agent-flow') renderAgentFlow(body, a);
  else if(a.subtype==='noise-to-insight') renderNoiseToInsight(body, a, head.querySelector('.artifact__expand'));

  // expand modal for all subtypes except noise-to-insight (which handles its own modal)
  if(a.subtype !== 'noise-to-insight'){
    head.querySelector('.artifact__expand').addEventListener('click', ()=>{
      pauseAutoPlay();
      openModal(a.name, body.cloneNode(true));
    });
  }
}

function renderFunnel(body, a){
  const funnel = document.createElement('div');

function renderBlueprint(body, a){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 520 440');
  svg.setAttribute('class','blueprint');
  // node helper
  const nodes = [
    { id:'q', x:210, y:12, w:100, h:52, cls:'bp-box--center', label:'用户提问', sub:'自然语言输入' },
    { id:'c', x:205, y:92, w:110, h:52, cls:'bp-box--accent', label:'对话入口', sub:'自然交互' },
    { id:'k', x:200, y:172, w:120, h:52, cls:'bp-box', label:'知识查询', sub:'语义路由' },
    { id:'g', x:49, y:252, w:100, h:62, cls:'bp-box', label:'因果图', sub:'看见原因' },
    { id:'e', x:371, y:252, w:100, h:62, cls:'bp-box', label:'证据库', sub:'追溯来源' },
    { id:'a', x:195, y:356, w:130, h:64, cls:'bp-box--core', label:'可解释回答', sub:'可信回答', core:true }
  ];
  const links = [
    ['q','c'],['c','k'],['k','g'],['k','e'],['g','a'],['e','a']
  ];
  // center points
  function cx(n){ return n.x + n.w/2; }
  function cy(n){ return n.y + n.h/2; }
  // draw links
  links.forEach(([f,t])=>{
    const fn = nodes.find(n=>n.id===f), tn = nodes.find(n=>n.id===t);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const x1=cx(fn), y1=fn.y+fn.h, x2=cx(tn), y2=tn.y;
    const my=(y1+y2)/2;
    path.setAttribute('d','M '+x1+' '+y1+' C '+x1+' '+my+', '+x2+' '+my+', '+x2+' '+y2);
    path.setAttribute('class','bp-link');
    svg.appendChild(path);
  });
  // draw nodes
  nodes.forEach(n=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','bp-node');
    g.dataset.id = n.id;
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',n.x); rect.setAttribute('y',n.y);
    rect.setAttribute('width',n.w); rect.setAttribute('height',n.h);
    rect.setAttribute('rx',10);
    rect.setAttribute('class','bp-box '+n.cls);
    g.appendChild(rect);
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',cx(n)); label.setAttribute('y',n.y+n.h/2-8);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('class','bp-label');
    label.textContent = n.label;
    g.appendChild(label);
    const sub = document.createElementNS('http://www.w3.org/2000/svg','text');
    sub.setAttribute('x',cx(n)); sub.setAttribute('y',n.y+n.h/2+13);
    sub.setAttribute('text-anchor','middle');
    sub.setAttribute('class','bp-sub');
    sub.textContent = n.sub;
    g.appendChild(sub);
    if(n.core){
      const tag = document.createElementNS('http://www.w3.org/2000/svg','text');
      tag.setAttribute('x',cx(n)); tag.setAttribute('y',n.y-6);
      tag.setAttribute('text-anchor','middle');
      tag.setAttribute('class','bp-core-tag');
      tag.textContent = '产品核心';
      g.appendChild(tag);
    }
    // hover dim others
    g.addEventListener('mouseenter', ()=>{
      nodes.forEach(m=>{
        const mg = svg.querySelector('.bp-node[data-id="'+m.id+'"]');
        if(m.id!==n.id) mg.classList.add('bp-dim');
      });
    });
    g.addEventListener('mouseleave', ()=>{
      svg.querySelectorAll('.bp-node').forEach(mg=>mg.classList.remove('bp-dim'));
    });
    svg.appendChild(g);
  });
  body.appendChild(svg);
  if(a.preview){
    const ip = document.createElement('div');
    ip.className = 'interface-preview reveal-item';
    ip.innerHTML = '<div class="interface-preview__label">呈现方式 · 方案预览</div>'+
      '<div class="ip-grid">'+
      '<div class="ip-col ip-col--nav">导航<br>· 首页<br>· 图库<br>· 文献</div>'+
      '<div class="ip-col ip-col--mid"><div class="ip-answer">回答</div>对话区承载任务与解释</div>'+
      '<div class="ip-col ip-col--trace"><div class="ip-step">步骤 01</div><div class="ip-step">步骤 02</div><div class="ip-step">步骤 03</div></div>'+
      '</div>'+
      '<div class="ip-bottom">'+
      '<div class="ip-bottom__box">知识库 / 文献库</div>'+
      '<div class="ip-bottom__arrow"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M288.791335 65.582671l446.41733 446.417329-446.41733 446.417329z" fill="#C7A18E"></path></svg></div>'+
      '<div class="ip-bottom__box ip-bottom__box--accent"><span class="ip-up-arrow"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M65.582671 735.208665l446.417329-446.41733 446.417329 446.41733z" fill="#C7A18E"></path></svg></span>知识图谱</div>'+
      '</div>';
    body.appendChild(ip);
  }
  revealSequence(body.querySelectorAll('.reveal-item'), 130, 500);
}

      body.querySelectorAll('.iface__tab').forEach(b=>b.classList.remove('is-active'));
      body.querySelectorAll('.iface__panel').forEach(p=>p.classList.remove('is-active'));
      btn.classList.add('is-active');
      body.querySelector('.iface__panel[data-panel="'+btn.dataset.tab+'"]').classList.add('is-active');
    });
  });
  body.querySelectorAll('.iface__hotspot').forEach(dot=>{
    dot.addEventListener('mouseenter', ()=>{ tip.textContent = dot.dataset.tip; });
    dot.addEventListener('click', ()=>{
      pauseAutoPlay();
      const pid = dot.closest('.iface__panel').dataset.panel;
      openModal('Interface Preview · '+dot.dataset.tip, buildScreen(pid));
    });
  });
  if(speed >= 7000){
    ifaceTimer = setInterval(()=>{
      const active = body.querySelector('.iface__tab.is-active');
      const all = Array.from(body.querySelectorAll('.iface__tab'));
      const idx = all.indexOf(active);
      all[(idx+1)%all.length].click();

}

/* ---------- Module 02 · Step Switcher Artifact ---------- */
function renderNoiseToInsight(body, a, expandBtn){
  let activeIdx = 0;
  const wrap = document.createElement('div');
  wrap.className = 'nti';

  // Step switcher (used only inside modal)
  const switcher = document.createElement('div');
  switcher.className = 'nti__switcher';
  const panes = [];
  const paneContents = [];

  a.steps.forEach((step, i)=>{
    const tab = document.createElement('button');
    tab.className = 'nti__tab' + (i===0?' is-active':'');
    tab.type = 'button';
    tab.innerHTML = '<span class="nti__tab-idx">'+step.idx+'</span>'+
      '<span class="nti__tab-en">'+step.en+'</span>'+
      '<span class="nti__tab-title">'+step.title+'</span>';
    switcher.appendChild(tab);

    const pane = document.createElement('div');
    pane.className = 'nti__pane';

    // Step header: 01 VALIDATE 验证需求
    const header = document.createElement('div');
    header.className = 'nti__step-header reveal-item';
    header.innerHTML = '<span class="nti__step-idx">'+step.idx+'</span>'+
      '<span class="nti__step-en">'+step.en+'</span>'+
      '<span class="nti__step-title">'+step.title+'</span>';
    pane.appendChild(header);

    // Step content (reused for modal, without header)
    const content = document.createElement('div');
    content.className = 'nti__pane-content';
    if(step.id==='validate') renderValidatePane(content, step);
    else if(step.id==='listen') renderListenPane(content, step);
    else if(step.id==='update') renderUpdatePane(content, step);
    pane.appendChild(content);

    panes.push(pane);
    paneContents.push(content);
  });

  // Default view: all three steps stacked vertically with dividers
  const canvas = document.createElement('div');
  canvas.className = 'nti__canvas';
  panes.forEach((p, i)=>{
    canvas.appendChild(p);
    if(i < panes.length - 1){
      const divider = document.createElement('div');
      divider.className = 'nti__divider';
      canvas.appendChild(divider);
    }
  });

  wrap.appendChild(canvas);
  body.appendChild(wrap);

  // Expand opens modal with switcher + panes
  if(expandBtn){
    expandBtn.addEventListener('click', ()=>{
      pauseAutoPlay();
      const modalWrap = document.createElement('div');
      modalWrap.className = 'nti nti--modal';
      const modalSwitcher = switcher.cloneNode(true);
      const modalTabs = Array.from(modalSwitcher.querySelectorAll('.nti__tab'));
      const modalCanvas = document.createElement('div');
      modalCanvas.className = 'nti__canvas';
      const modalPanes = paneContents.map((content, idx)=>{
        const mp = document.createElement('div');
        mp.className = 'nti__pane' + (idx===activeIdx?' is-active':'');
        mp.appendChild(content.cloneNode(true));
        return mp;
      });

      modalTabs.forEach((t, i)=>{
        t.classList.toggle('is-active', i===activeIdx);
        t.addEventListener('click', ()=>{
          modalTabs.forEach((mt,idx)=> mt.classList.toggle('is-active', idx===i));
          modalPanes.forEach((mp,idx)=> mp.classList.toggle('is-active', idx===i));
          if(modalPanes[i]) revealSequence(modalPanes[i].querySelectorAll('.reveal-item'), 90, 900);
        });
      });
      modalPanes.forEach(mp=>modalCanvas.appendChild(mp));

      modalWrap.append(modalSwitcher, modalCanvas);
      openModal(a.name, modalWrap);
    });
  }

  revealSequence(wrap.querySelectorAll('.reveal-item'), 90, 900);
}

/* staggered reveal */
function revealSequence(items, step=110, maxDelay=900){
  items = Array.from(items);
  if(REDUCED_MOTION){ items.forEach(it=>it.classList.add('reveal-in')); return; }
  items.forEach((it,i)=>{
    const d = Math.min(i*step, maxDelay);
    setTimeout(()=>it.classList.add('reveal-in'), d);
  });
}

/* ---------- Navigation ---------- */
function renderNav(mod){
  const idx = MODULES.findIndex(m=>m.id===mod.id);
  const prev = MODULES[idx-1];
  const next = MODULES[idx+1];
  if(prev){ prevBtn.disabled=false; prevTitle.textContent = prev.number+' '+prev.title; }
  else { prevBtn.disabled=true; prevTitle.textContent=''; }
  if(next){ nextBtn.disabled=false; nextTitle.textContent = next.number+' '+next.title; }
  else { nextBtn.disabled=true; nextTitle.textContent=''; }
}

prevBtn.addEventListener('click', ()=>{
  const idx = MODULES.findIndex(m=>m.id===currentId);
  if(idx>0){ pauseAutoPlay(); goToModule(MODULES[idx-1].id); }
});
nextBtn.addEventListener('click', ()=>{
  const idx = MODULES.findIndex(m=>m.id===currentId);
  if(idx<MODULES.length-1){
    const nxt = MODULES[idx+1];
    if(nxt.status==='pending'){ pauseAutoPlay(); showNodeHint(nxt.id); return; }
    pauseAutoPlay(); goToModule(nxt.id);
  }
});

 * Auto Play
 * ============================================================ */
let autoplay = false;
let playTimer = null;
let playTick = null;
let speed = 5000;
let ifaceTimer = null;
const AUTOPLAY_CHEVRONS = 5;

function nextReadyId(id){
  const idx = MODULES.findIndex(m=>m.id===id);
  for(let i=idx+1;i<MODULES.length;i++){
    if(MODULES[i].status==='ready') return MODULES[i].id;
  }
  return null;
}

function positionPlayheadAtCurrent(){
  const node = nodeEls[currentId];
  if(!node) return;
  const trackRect = track.getBoundingClientRect();
  const r = node.getBoundingClientRect();
  playhead.style.transition = 'none';
  playhead.style.transform = 'translateX('+(r.left - trackRect.left + r.width/2)+'px)';
  playhead.classList.remove('is-visible');
}

function positionPlayheadBetween(fromId, toId){
  const fromNode = nodeEls[fromId];
  const toNode = nodeEls[toId];
  if(!fromNode || !toNode) return;
  const trackRect = track.getBoundingClientRect();
  const fr = fromNode.getBoundingClientRect();
  const tr = toNode.getBoundingClientRect();
  const fromCx = fr.left - trackRect.left + fr.width/2;
  const toCx = tr.left - trackRect.left + tr.width/2;
  const mid = (fromCx + toCx)/2;
  playhead.style.transition = 'none';
  playhead.style.transform = 'translateX('+(mid - playhead.offsetWidth/2)+'px)';
}

function startProgress(toId){
  playhead.classList.remove('is-visible');
  // 彻底重建箭头 DOM，根除旧 filled 状态残留
  playhead.innerHTML = '<span>›</span>'.repeat(AUTOPLAY_CHEVRONS);
  void playhead.offsetWidth;
  positionPlayheadBetween(currentId, toId);
  playhead.classList.add('is-visible');
  clearInterval(playTick);
  const start = performance.now();
  playTick = setInterval(()=>{
    const spans = playhead.querySelectorAll('span');
    const elapsed = performance.now() - start;
    const filled = Math.min(AUTOPLAY_CHEVRONS, Math.floor(elapsed / (speed / AUTOPLAY_CHEVRONS)) + 1);
    spans.forEach((s,i)=> s.classList.toggle('is-filled', i < filled));
  }, 40);
}

function scheduleNext(){
  clearTimeout(playTimer);
  clearInterval(playTick);
  if(!autoplay) return;
  const nxt = nextReadyId(currentId);
  if(!nxt){ pauseAutoPlay(); return; }
  startProgress(nxt);
  playTimer = setTimeout(()=>{
    clearInterval(playTick);
    if(!autoplay) return;
    playhead.classList.remove('is-visible');
    playhead.querySelectorAll('span').forEach(s=>s.classList.remove('is-filled'));
    goToModule(nxt, true);
    setTimeout(()=>{ scheduleNext(); }, 260);
  }, speed);
}

function startAutoPlay(){
  if(autoplay) return;
  autoplay = true;
  autoplayBtn.classList.remove('is-paused');
  autoplayBtn.classList.add('is-playing');
  const ico = autoplayBtn.querySelector('.btn-autoplay__ico');
  const txt = autoplayBtn.querySelector('.btn-autoplay__txt');
  if(ico) ico.textContent = '⏸';
  if(txt) txt.textContent = 'Pause';
  // if at last ready module, restart from first ready
  if(!nextReadyId(currentId)){
    const firstReady = MODULES.find(m=>m.status==='ready');
    if(firstReady && firstReady.id!==currentId){
      goToModule(firstReady.id, true);
      setTimeout(()=>{ scheduleNext(); }, 260);
      return;
    }
  }
  scheduleNext();
}

function pauseAutoPlay(){
  if(!autoplay && !playhead.classList.contains('is-visible')) {
    // still update button if needed
  }
  autoplay = false;
  clearTimeout(playTimer);
  clearInterval(playTick);
  playhead.classList.remove('is-visible');
  autoplayBtn.classList.remove('is-playing');
  autoplayBtn.classList.add('is-paused');
  const ico = autoplayBtn.querySelector('.btn-autoplay__ico');
  const txt = autoplayBtn.querySelector('.btn-autoplay__txt');
  if(ico) ico.textContent = '▷';
  if(txt) txt.textContent = 'Auto Play';
}

autoplayBtn.addEventListener('click', ()=>{
  if(autoplay) pauseAutoPlay();
  else startAutoPlay();
});

/* ============================================================
 * Modal
 * ============================================================ */
let _bodyOverflowBackup = '';

/* 构造详情弹窗的独立文档（srcdoc）：整份 style + 详情 HTML + 事件委托脚本，
   通过 postMessage 交给父窗口的 #designExpandModal iframe 渲染（与 demo 同构） */
function buildDetailDoc(contentNode){
  const styleEl = document.querySelector('style');
  const css = styleEl ? styleEl.textContent : '';
  const body = contentNode ? contentNode.outerHTML : '';
  const js = [
    '(function(){',
    '  function reveal(items, step, max){',
    '    items = Array.from(items);',
    '    items.forEach(function(it, i){ setTimeout(function(){ it.classList.add("reveal-in"); }, Math.min(i*step, max)); });',
    '  }',
    '  var wrap = document.querySelector(".nti--modal");',
    '  if(wrap){',
    '    var tabs = Array.from(wrap.querySelectorAll(".nti__tab"));',
    '    var panes = Array.from(wrap.querySelectorAll(".nti__pane"));',
    '    tabs.forEach(function(t, i){',
    '      t.addEventListener("click", function(){',
    '        tabs.forEach(function(mt, idx){ mt.classList.toggle("is-active", idx===i); });',
    '        panes.forEach(function(mp, idx){ mp.classList.toggle("is-active", idx===i); });',
    '        if(panes[i]) reveal(panes[i].querySelectorAll(".reveal-item"), 90, 900);',
    '      });',
    '    });',
    '  }',
    '  var seed = document.querySelector(".nti__pane.is-active") || document.body;',
    '  reveal(seed.querySelectorAll(".reveal-item"), 110, 900);',
  '  document.addEventListener("click", function(e){',
  '    var img = e.target.closest && e.target.closest(".arch__demo-img");',
  '    if(img){ var src = img.getAttribute("src") || img.src; try{ parent.postMessage({type:"img-zoom", src:src}, "*"); }catch(err){} }',
  '  });',
  '  /* Module 06 · 放大面板内的三折叠 Section 重新绑定收纳/展开（cloneNode 不复制监听器） */',
  '  var secHeads = Array.from(document.querySelectorAll(".agent-sec__head"));',
  '  secHeads.forEach(function(h){',
  '    h.addEventListener("click", function(){',
  '      var sec = h.closest(".agent-sec");',
  '      if(!sec) return;',
  '      var isOpen = sec.classList.toggle("is-open");',
  '      var t = h.querySelector(".agent-sec__toggle");',
  '      if(t) t.textContent = isOpen ? "−" : "+";',
  '    });',
  '  });',
  '})();'
  ].join('\n');
  return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
         '<style>' + css + '</style></head>' +
         '<body style="background:#FFFFFF;padding:24px 24px 24px;box-sizing:border-box">' + body + '<script>' + js + '</scr' + 'ipt></body></html>';
}

function openModal(title, contentNode){
  const srcdoc = buildDetailDoc(contentNode);
  // 展开宽度不小于原右侧面板宽度，保证内容不被压缩（每个 module 面板宽度不同 → 弹窗宽度不同）
  const colW = artifactCol ? artifactCol.offsetWidth : 0;
  const width = Math.max(colW, 560);
  if(window.parent !== window){
    try{ window.parent.postMessage({type:'design-expand', open:true, title:title, srcdoc:srcdoc, width:width}, '*'); }catch(err){}
  }
}

function closeModal(){
  if(window.parent !== window){
    try{ window.parent.postMessage({type:'design-expand', open:false}, '*'); }catch(err){}
  }
}
modalClose.addEventListener('click', closeModal);
/* Module 05 图片：点击放大（向父窗口发送 img-zoom 消息，由顶层灯箱处理） */
document.addEventListener('click', function(e){
  var img = e.target.closest && e.target.closest('.arch__demo-img');
  if(img){
    var src = img.getAttribute('src') || img.src;
    try{ window.parent.postMessage({type:'img-zoom', src:src}, '*'); }catch(err){}
  }
});

/* ============================================================
 * Init
 * ============================================================ */
buildJourney();
goToModule(1, false);
positionPlayheadAtCurrent();

/* 全局自定义 tooltip（替代 title） */
(function(){
  var tip = document.createElement('div');
  tip.id = 'pj-tooltip';
  tip.className = 'pj-tooltip';
  document.body.appendChild(tip);
  var timer = null;
  var currentTarget = null;
  function hide(){ currentTarget=null; clearTimeout(timer); tip.classList.remove('pj-tooltip--show'); }
  function position(el){
    var rect=el.getBoundingClientRect(), tr=tip.getBoundingClientRect(), pad=6;
    var top=rect.top-tr.height-pad, left=rect.left+rect.width/2-tr.width/2;
    if(left<4) left=4;
    if(left+tr.width>window.innerWidth-4) left=window.innerWidth-tr.width-4;
    if(top<4) top=rect.bottom+pad;
    tip.style.top=top+'px'; tip.style.left=left+'px';
  }
  function show(el){
    var text=el.getAttribute('data-tooltip'); if(!text) return;
    currentTarget=el; tip.textContent=text; tip.classList.add('pj-tooltip--show'); position(el);
  }
  document.addEventListener('mouseover',function(e){
    var el=e.target.closest&&e.target.closest('[data-tooltip]'); if(!el) return;
    clearTimeout(timer); timer=setTimeout(function(){ show(el); },400);
  });
  document.addEventListener('mouseout',function(e){
    var el=e.target.closest&&e.target.closest('[data-tooltip]'); if(!el) return;
    hide();
  });
  window.addEventListener('scroll',function(){ if(currentTarget) position(currentTarget); },true);
  window.addEventListener('resize',function(){ if(currentTarget) position(currentTarget); });
})();
</script>
