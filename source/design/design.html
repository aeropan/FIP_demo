<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品设计说明 · Product Journey</title>
<style>
:root{
  /* ===== Primary (暖杏奶油 V2) ===== */
  --c-primary-900:#6B5045;
  --c-primary-700:#8C6B5D;
  --c-primary-500:#C7A18E;
  --c-primary-100:#FAF3EC;
  /* ===== Neutral ===== */
  --c-text-main:#3E3836;
  --c-text-secondary:#6F6763;
  --c-border:#EDE5DD;
  --c-surface:#FDFBF7;
  --c-card:#FFFFFF;
  --c-header:#FFF9F5;
  /* ===== Semantic (克制使用) ===== */
  --c-success-bg:#F4F7F1;
  --c-success-border:#D6E2CF;
  --c-success-main:#6F8A6A;
  --c-success-dark:#53664F;
  --c-warning-bg:#FFF8EC;
  --c-warning-border:#F2DFC0;
  --c-warning-main:#C38A35;
  --c-warning-dark:#9A6825;
  --c-info-bg:#F2F6F8;
  --c-info-border:#D7E2E8;
  --c-info-main:#6D8795;
  --c-info-dark:#536673;
  /* ===== Radius ===== */
  --r-sm:6px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* ===== Shadow (暖灰) ===== */
  --sh-card:0 1px 2px rgba(62,56,54,0.04);
  --sh-hover:0 4px 14px rgba(62,56,54,0.08);
  /* ===== Font ===== */
  --f-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ===== Spacing ===== */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  /* ===== Motion ===== */
  --ease:cubic-bezier(0.4, 0, 0.2, 1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{
  overflow-y:scroll;
  scrollbar-width:thin;
  scrollbar-color:rgba(111,103,99,0.2) transparent;
}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(111,103,99,0.2);border-radius:4px;transition:background .2s ease;}
::-webkit-scrollbar-thumb:hover{background:rgba(111,103,99,1);}
body{
  background:var(--c-surface);
  color:var(--c-text-main);
  font-family:var(--f-sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.pj-root{max-width:1440px;margin:0 auto;padding:32px 36px 40px;}

/* ============ 01 · Project Header ============ */
.pj-header{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--s6);padding:0 0 28px;
}
.pj-header__title{font-size:28px;line-height:1.3;font-weight:700;color:var(--c-text-main);margin:0 0 var(--s2);letter-spacing:.2px;}
.pj-header__desc{font-size:15px;color:var(--c-text-secondary);margin:0;max-width:640px;}
.pj-header__sub{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;margin:0 0 var(--s2);}
.pj-header__tags{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:flex-end;}
.pj-tag{font-size:12px;color:var(--c-primary-700);background:var(--c-primary-100);border:1px solid var(--c-border);padding:var(--s1) var(--s3);border-radius:var(--r-pill);white-space:nowrap;}
.pj-tag--status{color:var(--c-success-dark);background:var(--c-success-bg);border-color:var(--c-success-border);}

/* ============ 02 · Journey（V3 线分隔：回归页面色 + 上下细线，无大色块） ============ */
.pj-journey{position:relative;background:linear-gradient(180deg, rgba(250,243,236,0.35), rgba(253,251,247,0));border-bottom:1px solid var(--c-border);}
.journey-band{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;}
.pj-autoplay{display:flex;align-items:center;flex:0 0 auto;}
.btn-autoplay{
  font-family:var(--f-sans);font-size:11px;font-weight:600;cursor:pointer;
  border:none;background:none;border-radius:var(--r-sm);padding:var(--s2);
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;transition:all .18s ease;color:var(--c-text-secondary);white-space:nowrap;
}
.btn-autoplay__ico{font-size:12px;line-height:1;}
.btn-autoplay__txt{font-size:11px;line-height:1;}
.btn-autoplay.is-playing{background:#EFE3D6;color:var(--c-primary-900);}
.btn-autoplay:hover{color:var(--c-primary-700);}

.journey-track{position:relative;display:flex;align-items:center;flex:1 1 auto;min-width:0;padding:0 0 14px;}
.journey-segment{display:flex;flex-direction:column;}
.segment-label{display:none;}
.segment-nodes{display:flex;align-items:center;}
.journey-divider{width:1px;align-self:stretch;background:var(--c-border);margin:0 var(--s3);}
.j-node{display:flex;flex-direction:column;align-items:center;gap:var(--s1);cursor:pointer;position:relative;flex:0 0 auto;width:60px;padding:6px 2px;}
.j-dot{
  width:30px;height:30px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--c-text-secondary);
  background:transparent;border:1px solid var(--c-border);transition:all .18s ease;
}
.j-title{font-size:10px;color:var(--c-text-secondary);text-align:center;max-width:100%;white-space:nowrap;line-height:1.3;transition:color .18s ease;}
.j-link{width:18px;height:2px;background:var(--c-border);margin:0 var(--s1);align-self:flex-start;margin-top:14px;transition:background .3s ease;flex:0 0 auto;}
/* node states */
.j-node:hover .j-dot{background:var(--c-primary-100);border-color:var(--c-primary-500);color:var(--c-primary-900);}
.j-node:hover .j-title{color:var(--c-primary-900);}
.j-node.is-current .j-dot{background:var(--c-primary-100);border:1px solid var(--c-primary-700);color:var(--c-primary-900);}
.j-node.is-current .j-title{color:var(--c-primary-900);font-weight:600;}
.j-node.is-current::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--c-primary-700);border-radius:2px;}
/* 非当前模块一律中性，不抢戏（仅当前模块用 Primary 作为锚点） */
.j-node.is-done .j-dot{border-color:var(--c-border);color:var(--c-text-secondary);}
.j-node.is-done .j-link,.j-link.is-done{background:var(--c-border);}
.j-node.is-pending{opacity:.55;cursor:not-allowed;}
.j-node.is-pending:hover .j-dot{background:transparent;border-color:var(--c-border);color:var(--c-text-secondary);}

/* playhead (chevrons) */
.playhead{position:absolute;top:22px;left:0;display:flex;gap:0;pointer-events:none;opacity:0;transition:opacity .3s ease;z-index:5;}
.playhead.is-visible{opacity:1;}
.playhead span{color:var(--c-border);font-size:10px;line-height:1;font-weight:900;transition:color .25s ease;padding:0 1px;letter-spacing:-0.5px;display:inline-block;}
.playhead span.is-filled{color:var(--c-primary-500);}
/* pending 提示现在复用全局 .pj-tooltip，node-hint DOM 已移除 */

/* ============ 03 · Module Header ============ */
.pj-module{transition:opacity .25s ease, transform .25s ease;}
.pj-module.switching{opacity:0;transform:translateY(-8px);}
.pj-module.entering{opacity:0;transform:translateY(8px);}
.module-header{padding:var(--s5) 0 var(--s6);border-bottom:1px solid var(--c-border);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s6);}
.module-header__meta{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;margin:0 0 var(--s2);}
.module-header__title{font-size:24px;font-weight:700;color:var(--c-primary-900);margin:0 0 var(--s2);line-height:1.3;}
.module-header__thesis{font-size:15px;color:var(--c-text-secondary);margin:0;max-width:760px;}
.module-header__side{display:flex;align-items:center;gap:var(--s4);}
.module-header__actions{display:flex;align-items:center;}
.module-header__file{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-card);color:var(--c-primary-700);cursor:pointer;transition:all .2s ease;}
.module-header__file:hover{background:var(--c-primary-100);border-color:var(--c-primary-500);color:var(--c-primary-900);}
.module-header__file svg{display:block;width:28px;height:28px;}
.module-header__file span{font-size:10px;letter-spacing:.5px;white-space:nowrap;}
.demo-entry{margin-bottom:var(--s4);width:fit-content;}
.module-header__count{font-family:var(--f-mono);font-size:14px;color:var(--c-text-secondary);white-space:nowrap;padding-top:var(--s2);}

/* ============ 04 · Module Workspace ============ */
.module-workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,0.85fr);gap:var(--s8);padding:var(--s8) 0;align-items:start;}
/* left thinking · vertical narrative rail */
.thinking{position:relative;display:flex;flex-direction:column;}
/* ===== 左侧：由各 leftType 决定布局节奏，不再统一时间线壳 ===== */
/* narrative (M01) · 轻量叙事轨道 */
.nl-section{position:relative;padding:var(--s2) 0 var(--s6) var(--s6);}
.nl-section::before{content:"";position:absolute;top:8px;bottom:0;left:7px;width:2px;background:linear-gradient(to bottom,var(--c-border),rgba(237,229,221,0));}
.nl-section .t-block__title{position:relative;}
.nl-section .t-block__title::before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--c-primary-700);border:2px solid var(--c-surface);box-sizing:border-box;}

/* evidence (M02) · 假设→信号→变化 三段流 */
.ev-stage{padding:var(--s4) 0;}
.ev-arrow{text-align:center;padding:var(--s1) 0;}
.ev-arrow svg{display:inline-block;vertical-align:middle;}

/* gallery (M04) · 探索方向去卡，三列直接成主体 */
.gl-block{padding:var(--s3) 0 var(--s5);}
.gl-block .t-dirs{gap:var(--s4);}

/* architecture (M05) / interface (M06) · 大分区标题 */
.ar-stage{padding:var(--s3) 0 var(--s5);}
.if-stage{padding:var(--s3) 0 var(--s5);}
.ar-stage .t-block__title,.if-stage .t-block__title{border-bottom:1px solid var(--c-border);padding-bottom:var(--s2);}

/* engineering (M07) · 构建原则索引式（横线分隔） */
.en-item{padding:var(--s4) 0;border-bottom:1px solid var(--c-border);}
.en-item:last-child{border-bottom:none;}
.en-item .t-parts__item{border-top:1px solid var(--c-border);padding:var(--s3) 0;}
.en-item .t-parts__item:first-child{border-top:none;}
.en-item .t-parts__idx{font-size:16px;color:var(--c-primary-900);}

/* proof (M08) · 验证框架（✓ 指示） */
.pf-frame{padding:var(--s2) 0;}
.pf-frame .t-dim{display:flex;align-items:flex-start;gap:var(--s3);}
.pf-frame .t-dim::before{content:"✓";flex:0 0 auto;color:var(--c-primary-700);font-weight:700;}

/* delivery (M09) · 交付清单（✓）+ 收束 */
.dl-item{padding:var(--s3) 0;}
.dl-item .t-deliv{display:flex;align-items:flex-start;gap:var(--s3);}
.dl-item .t-deliv::before{content:"✓";flex:0 0 auto;color:var(--c-primary-700);font-weight:700;}
.dl-close{margin-top:var(--s5);text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:1px;color:var(--c-text-secondary);}
.dl-close span{display:block;color:var(--c-primary-700);font-size:18px;margin:4px 0;}
.t-block__title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;margin:0 0 var(--s3);}
.t-block__body{font-size:15px;color:var(--c-text-main);}
/* Module 01 specific */
.t-start__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-700);font-weight:600;}
.t-start__accent{color:var(--c-primary-900);font-size:16px;font-weight:600;margin-top:var(--s2);}
.t-noticed__points{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3);}
.t-point{font-size:15px;color:var(--c-text-main);}
.t-highlight{border-left:3px solid var(--c-primary-700);background:var(--c-primary-100);padding:var(--s4) var(--s5);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px;color:var(--c-text-main);margin-top:var(--s4);}
.t-decision{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--c-border);}
.t-decision:last-child{border-bottom:none;}
.t-decision__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-700);font-weight:600;flex:0 0 auto;padding-top:2px;}
.t-decision__tag{font-size:13px;font-weight:600;color:var(--c-primary-900);}
.t-decision__desc{font-size:14px;color:var(--c-text-secondary);margin-top:2px;}
.key-decision,.key-insight{
  background:var(--c-primary-100);
  border-left:3px solid var(--c-primary-700);
  border-radius:0 var(--r-md) var(--r-md) 0;
  padding:var(--s4) var(--s5);font-size:14px;color:var(--c-text-main);
}
.key-decision{margin-top:var(--s4);}
.key-insight{margin-top:var(--s6);}
.key-decision strong{color:var(--c-primary-900);font-weight:600;}
/* Module 02 specific */
.t-assumption{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--c-border);}
.t-assumption__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-text-secondary);font-weight:600;flex:0 0 auto;}
.t-assumption__text{font-size:14px;color:var(--c-text-main);}
.t-signal{border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3) var(--s4);margin-top:var(--s3);background:var(--c-card);}
.t-signal__tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;}
.t-signal__items{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2);}
.t-signal__chip{font-size:13px;color:var(--c-text-main);background:var(--c-primary-100);padding:2px var(--s3);border-radius:var(--r-pill);}
.t-note{margin-top:var(--s4);padding:var(--s3) var(--s4);background:var(--c-surface);border:1px dashed var(--c-border);border-radius:var(--r-sm);font-size:14px;color:var(--c-text-main);font-style:italic;}
.t-note__tag{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);font-style:normal;margin-bottom:4px;}
.t-pRIORITY__bar{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);}
.t-pRIORITY__label{font-family:var(--f-mono);font-size:12px;color:var(--c-text-secondary);width:140px;flex:0 0 auto;}
.t-pRIORITY__track{display:flex;gap:3px;}
.t-pRIORITY__seg{width:18px;height:10px;border-radius:2px;background:var(--c-border);}
.t-pRIORITY__seg.fill{background:var(--c-primary-700);}
/* Module 02 v2 · 验证问题 / 发现需求 / 修正假设 */
.t-block__en{font-size:11px;letter-spacing:1.5px;color:var(--c-text-secondary);margin-bottom:4px;}
.t-block__subtitle{font-size:18px;font-weight:700;color:var(--c-primary-900);margin:0 0 var(--s3);}
.t-question-list{margin:var(--s3) 0 0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s2);}
.t-question-list li{font-size:14px;color:var(--c-text-main);}
.t-signal-box{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s4);margin-top:var(--s6);background:var(--c-card);}
.t-signal-box__title{font-size:13px;font-weight:600;color:var(--c-primary-900);margin-bottom:var(--s3);}
.t-signal-row{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);}
.t-signal-row:last-child{margin-bottom:0;}
.t-signal-row__label{font-size:13px;color:var(--c-text-main);width:110px;flex:0 0 auto;}
.t-signal-row__track{flex:1;display:flex;gap:3px;align-items:center;}
.t-signal-seg{flex:1;height:10px;border-radius:3px;background:var(--c-border);transition:background .25s ease;}
.t-signal-seg.is-filled{background:var(--c-primary-700);}
.t-signal-row__level{font-size:12px;color:var(--c-text-secondary);width:40px;text-align:right;}
.t-signal-box__note{font-size:12px;color:var(--c-text-secondary);margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--c-border);}
.t-flow-chain{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0;font-family:var(--f-mono);font-size:12px;color:var(--c-primary-700);}
.t-flow-chain__item{background:var(--c-primary-100);color:var(--c-primary-900);padding:var(--s1) var(--s3);border-radius:var(--r-sm);font-weight:600;}
.t-flow-chain__arrow{color:var(--c-primary-500);}
.t-quote-pairs{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s3);}
.t-quote-pair{border-left:2px solid var(--c-border);padding-left:var(--s4);display:flex;flex-direction:column;gap:var(--s3);}
.t-quote-pair__quote{font-size:14px;color:var(--c-text-secondary);font-style:italic;line-height:1.6;}
.t-quote-pair__arrow{text-align:left;color:var(--c-primary-500);font-size:16px;padding:var(--s1) 0;}
.t-quote-pair__need{font-size:15px;color:var(--c-text-main);line-height:1.6;}
.t-cases{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s3);}
.t-case{background:var(--c-card);border:1px solid var(--c-border);border-top:3px solid var(--c-primary-700);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);box-shadow:var(--sh-card);}
.t-case__tag{font-size:11px;letter-spacing:1px;color:var(--c-primary-700);font-weight:600;display:block;margin-bottom:2px;}
.t-case__before,.t-case__after{font-size:14px;color:var(--c-text-main);}
.t-case__decision{font-size:14px;color:var(--c-primary-900);font-weight:600;padding-top:var(--s2);border-top:1px dashed var(--c-border);}
.t-case__arrow{color:var(--c-primary-500);font-size:16px;}
.t-key-insight{margin-top:var(--s5);padding:var(--s4) var(--s5);background:var(--c-primary-100);border-left:3px solid var(--c-primary-700);border-radius:0 var(--r-md) var(--r-md) 0;font-size:15px;color:var(--c-primary-900);font-weight:600;}
/* Module 03 specific */
.t-loop{display:flex;gap:var(--s3);margin-top:var(--s3);}
.t-loop__item{flex:1;border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3);text-align:center;background:var(--c-card);}
.t-loop__tag{font-size:13px;font-weight:600;color:var(--c-primary-900);}
.t-loop__desc{font-size:12px;color:var(--c-text-secondary);margin-top:4px;}
.t-parts__item{display:flex;gap:var(--s3);padding:var(--s3) 0;}
.t-parts__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-700);font-weight:600;flex:0 0 auto;}
.t-parts__tag{font-size:14px;font-weight:600;color:var(--c-primary-900);}
.t-parts__desc{font-size:13px;color:var(--c-text-secondary);margin-top:2px;}
.t-note--loop{background:var(--c-primary-100);border-style:solid;border-color:var(--c-border);font-style:normal;white-space:pre-wrap;}
.t-decision-q{font-size:14px;font-weight:600;color:var(--c-primary-900);margin-top:var(--s3);}
.t-decision-a{font-size:14px;color:var(--c-text-secondary);margin-top:2px;}

/* right artifact */
.artifact{
  background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-md);
  padding:var(--s6);box-shadow:var(--sh-card);position:relative;
  display:flex;flex-direction:column;
}
.artifact__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s6);}
.artifact__name{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;}
.artifact__caption{font-size:13px;color:var(--c-text-secondary);margin-top:4px;max-width:420px;}
.artifact__expand{font-size:13px;color:var(--c-primary-700);background:none;border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s2) var(--s3);cursor:pointer;transition:all .18s ease;white-space:nowrap;}
.artifact__expand:hover{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.artifact__body{position:relative;}
.artifact__footnote{font-size:12px;color:var(--c-text-secondary);margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--c-border);}
/* Artifact 密度模式：避免右侧都是同尺寸白盒 */
.artifact--compact{padding:var(--s5);}
.artifact--compact .artifact__head{margin-bottom:var(--s5);}
.artifact--fill{padding:var(--s8);}
.artifact--fill .artifact__head{margin-bottom:var(--s8);}
.artifact--dense{padding:var(--s5);font-size:13px;}
.artifact--dense .artifact__head{margin-bottom:var(--s5);}

/* ===== Module 06 · Agent 设计 ===== */

/* 章节标签 CONCEPT / RULE / FUTURE EXTENSION（对齐 Module 05 的 .t-block__title） */
.agent-section{margin-top:var(--s6);}
.agent-section__label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;margin:0 0 var(--s3);}

/* CONCEPT 设计理念 */
.agent-concept{margin-bottom:var(--s6);padding-top:var(--s3);}
.agent-concept__list{display:flex;flex-direction:column;}
.agent-concept__item{display:flex;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px dashed var(--c-border);}
.agent-concept__item:last-child{border-bottom:none;}
.agent-concept__node{width:8px;height:8px;border-radius:50%;background:var(--c-primary-700);flex:0 0 auto;margin-top:6px;}
.agent-concept__body{flex:1 1 auto;}
.agent-concept__title{font-size:14px;font-weight:600;color:#6B5045;margin-bottom:4px;}
.agent-concept__desc{font-size:13px;color:#6F6763;line-height:1.5;}
/* CONCEPT · 职责拆分 下方：Agent 职责矩形链（视觉语言对齐 Module 05 KNOWLEDGE 流） */
.agent-concept__agents{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--s1) * 1.5) var(--s3);margin-top:var(--s3);}
.acg{display:inline-flex;align-items:center;gap:6px;}
.acg__name{font-family:var(--f-mono),ui-monospace,monospace;font-size:12px;font-weight:600;color:var(--c-primary-900);background:var(--c-primary-100);border:1px solid var(--c-primary-500);border-radius:var(--r-sm);padding:2px 8px;white-space:nowrap;}
.acg__arrow{color:var(--c-primary-500);font-weight:700;}
.acg__role{font-size:12px;color:var(--c-text-secondary);background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-sm);padding:2px 8px;white-space:nowrap;}
.acg__sep{color:var(--c-text-secondary);font-weight:300;padding:0 2px;}

/* 左侧：RULE · 设计决策（编号 + 左关键词 + 右解释 纵向列表） */
.agent-decision{margin-top:var(--s6);}
.agent-decision__list{display:flex;flex-direction:column;}
.agent-decision__item{display:flex;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px dashed var(--c-border);}
.agent-decision__item:last-child{border-bottom:none;}
.agent-decision__idx{font-family:var(--f-mono),ui-monospace,monospace;font-size:13px;color:var(--c-primary-700);font-weight:600;flex:0 0 auto;padding-top:1px;}
.agent-decision__body{flex:1 1 auto;min-width:0;}
.agent-decision__tags{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.agent-decision__trigger{font-size:14px;font-weight:600;color:var(--c-text-main);}
.agent-decision__arrow{color:var(--c-primary-700);}
.agent-decision__mech{font-size:12px;font-weight:600;color:var(--c-primary-700);background:var(--c-primary-100);padding:2px 8px;border-radius:999px;}
.agent-decision__harness{font-size:12px;font-weight:600;color:var(--c-primary-700);border:1px solid var(--c-primary-500);border-radius:999px;padding:2px 8px;}
.agent-decision__desc{font-size:13px;color:var(--c-text-secondary);line-height:1.55;}

/* 左侧：FUTURE EXTENSION · 扩展性设计（浅色虚线底框） */
.agent-future{margin-top:var(--s6);}
.agent-future__box{border:1px dashed var(--c-border);background:#FAF7F2;border-radius:8px;padding:14px 16px;}
.agent-future__position{background:var(--c-primary-100);border-left:3px solid var(--c-primary-500);border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.6;color:var(--c-text-main);}
.agent-future__points{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.af-point{background:#FFFFFF;border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;}
.af-point__head{font-size:12.5px;font-weight:600;color:#3E3836;margin-bottom:6px;}
.af-point__row{display:flex;gap:8px;font-size:12px;line-height:1.5;padding:2px 0;}
.af-point__k{flex:0 0 34px;color:var(--c-primary-700);font-weight:600;}
.af-point__v{flex:1 1 auto;color:var(--c-text-secondary);}
.agent-future__reserve{margin-top:12px;}
.agent-future__sub{font-size:12px;font-weight:600;color:var(--c-primary-700);margin-bottom:6px;}
.agent-future__pills{display:flex;flex-wrap:wrap;gap:6px;}
.af-pill{font-size:10.5px;color:#FFFFFF;background:#C7A18E;border:1px solid #C7A18E;border-radius:999px;padding:2px 10px;white-space:nowrap;}
.agent-future__note{font-size:13px;color:var(--c-text-secondary);line-height:1.55;margin-top:6px;}
.agent-future__principles{display:flex;gap:8px;margin-top:12px;}
.af-principle{flex:1 1 0;background:#FFFFFF;border:1px solid var(--c-border);border-radius:8px;padding:8px 10px;}
.af-principle__head{font-size:12px;font-weight:600;color:var(--c-primary-900);display:flex;align-items:center;gap:4px;}
.af-principle__x{color:var(--c-primary-500);font-weight:700;}
.af-principle__d{font-size:11px;color:var(--c-text-secondary);line-height:1.4;margin-top:3px;}

/* 右侧：AGENT SYSTEM 手风琴容器 */
.agent-system{display:block;}
.agent-system__inner{display:flex;flex-direction:column;gap:var(--s4);}
.agent-sec{border:1px solid var(--c-border);border-radius:12px;overflow:hidden;background:#FFFFFF;}
.agent-sec__head{display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;background:#FFF9F5;border:0;cursor:pointer;padding:16px 20px;font-family:inherit;}
.agent-sec__idx{font-family:var(--f-mono),ui-monospace,monospace;font-size:13px;color:var(--c-primary-700);font-weight:600;flex:0 0 auto;}
.agent-sec__titles{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0;}
.agent-sec__name{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--c-text-main);}
.agent-sec__caption{font-size:12px;color:var(--c-text-secondary);}
.agent-sec__toggle{flex:0 0 auto;font-size:18px;line-height:1;color:var(--c-primary-700);width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.agent-sec__body{display:none;padding:20px 20px 20px;}
.agent-sec.is-open .agent-sec__body{display:block;}

/* 右侧：架构图 SVG（主流程实线 / Boundary 虚线旁路） */
.agent-flow{width:100%;height:auto;display:block;}
.agent-flow__node rect{fill:#FFFFFF;stroke:var(--c-border);stroke-width:1;}
.agent-flow__boundary rect{fill:#FAF3EC;stroke:#EDE5DD;stroke-width:1;}
.agent-flow__line{stroke:var(--c-border);stroke-width:1.5;}
.agent-flow__dash{stroke:#C7A18E;stroke-width:1.5;stroke-dasharray:4 4;fill:none;}
.agent-flow__en{fill:#8C6B5D;font-size:11px;letter-spacing:1px;font-weight:600;font-family:var(--f-mono),ui-monospace,monospace;}
.agent-flow__zh{fill:#6B5045;font-size:13px;font-weight:600;}
.agent-flow__detail{fill:#6F6763;font-size:12px;}
.agent-flow__note{fill:#8C6B5D;font-size:11px;}
.agent-flow__cond{fill:#6F6763;font-size:11px;}

/* 右侧：Case Walkthrough */
.case-bubble{background:var(--c-primary-100);border-radius:12px 12px 12px 2px;padding:12px 16px;font-size:14px;color:var(--c-text-main);max-width:82%;margin-bottom:var(--s5);}
.case-metrics{display:flex;gap:var(--s4);margin-bottom:var(--s5);}
.case-metric{flex:1 1 0;min-width:0;border:1px solid var(--c-border);border-radius:10px;padding:12px;text-align:center;background:#FAF7F2;}
.case-metric__num{font-size:20px;font-weight:700;color:var(--c-primary-700);line-height:1.1;}
.case-metric__label{font-size:11px;color:var(--c-text-secondary);margin-top:4px;}
.case-track{display:flex;flex-direction:column;}
.case-step{display:flex;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px dashed var(--c-border);}
.case-step:last-child{border-bottom:none;}
.case-step__rail{flex:0 0 auto;padding-top:2px;}
.case-step__idx{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#FFFFFF;border:1px solid var(--c-border);color:var(--c-primary-700);font-size:11px;font-weight:600;font-family:var(--f-mono),ui-monospace,monospace;}
.case-step__body{flex:1 1 auto;min-width:0;}
.case-step__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.case-step__name{font-size:13px;font-weight:600;color:var(--c-text-main);}
.case-step__agent{font-size:11px;color:var(--c-primary-700);}
.case-step__status{font-size:10px;color:var(--c-text-secondary);border:1px solid var(--c-border);border-radius:999px;padding:1px 8px;letter-spacing:.5px;}
.case-step__io{font-size:12px;color:var(--c-text-secondary);line-height:1.5;}
.case-step__k{display:inline-block;min-width:34px;color:var(--c-primary-700);font-weight:600;margin-right:6px;}
.case-answer{margin-top:var(--s5);background:var(--c-primary-100);border-radius:12px;padding:14px 16px;}
.case-answer__text{font-size:13px;color:var(--c-text-main);line-height:1.6;}
.case-answer__tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--c-primary-700);border:1px solid var(--c-border);border-radius:999px;padding:2px 10px;background:#FFFFFF;}
.case-answer__note{font-size:12px;color:var(--c-text-secondary);margin-top:8px;}

/* 右侧：Future Extension 分叉 + 三结论 */
/* 右侧：FUTURE EXTENSION · 确定性主干流程图 */
.future-core{display:flex;flex-direction:column;align-items:stretch;}
.future-core__head{
  text-align:center;font-family:var(--f-mono),ui-monospace,monospace;
  font-size:12px;letter-spacing:2px;color:var(--c-primary-900);font-weight:600;
  padding:var(--s4) var(--s4) var(--s3);
  border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border);
}
.future-core__head + .future-core__row{margin-top:var(--s8);}
.future-core__row{display:grid;grid-template-columns:0.8fr auto 1.5fr;align-items:center;padding:2px 0;}
.future-core__box{
  grid-column:2;justify-self:center;min-width:200px;text-align:center;
  border:1px solid var(--c-border);background:#FFFFFF;border-radius:8px;
  padding:var(--s3) var(--s5);font-size:14px;font-weight:500;color:var(--c-text-main);
  display:flex;flex-direction:column;gap:2px;
}
.future-core__box--apricot{background:#FAF3EC;}
.future-core__box--beige{background:#F4EDE6;}
.future-core__box--core{
  position:relative;border-top-left-radius:0;border-top-right-radius:0;
  min-width:240px;
}
.future-core__box--core::before{
  content:'';position:absolute;top:-1px;left:0;right:0;height:4px;
  background:linear-gradient(90deg, var(--c-primary-500), var(--c-primary-700));
  border-top-left-radius:8px;border-top-right-radius:8px;
}
.future-core__box-sub{font-size:12px;font-weight:400;color:var(--c-text-secondary);}
.future-core__note{
  grid-column:3;justify-self:start;text-align:left;padding-left:var(--s3);
  font-size:11px;color:var(--c-primary-700);line-height:1.4;
  align-self:end;
}
.future-core__arrow{display:grid;grid-template-columns:0.8fr auto 1.5fr;}
.future-core__arrow-ph{
  grid-column:2;justify-self:center;
  display:flex;justify-content:center;align-items:center;
  color:var(--c-primary-500);font-size:16px;line-height:1;padding:2px 0;
}
.future-core__foot{
  text-align:center;font-size:12px;color:var(--c-text-secondary);line-height:1.5;
  padding:var(--s3) var(--s4) var(--s4);margin-top:var(--s5);
  border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border);
}

/* Key Insight 块（Module 06）多行文本 pre-wrap */
.module-workspace.is-agent-design .key-decision{white-space:pre-wrap;line-height:1.6;margin-top:var(--s5);}
.artifact--stepped .artifact__head{margin-bottom:0;}
.artifact__cap-divider{height:1px;background:var(--c-border);margin:var(--s4) 0 var(--s2) 0;}

/* reveal animation */
.reveal-item{opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease;}
.reveal-item.reveal-in{opacity:1;transform:translateY(0);}

/* ===== Module 01 · Opportunity Funnel ===== */
.funnel{display:flex;flex-direction:column;align-items:center;gap:0;}
.funnel__stage{
  border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-card);
  padding:var(--s4) var(--s5);text-align:center;transition:all .2s ease;position:relative;cursor:default;
}
.funnel__stage:hover{transform:translateY(-2px);border-color:var(--c-primary-700);box-shadow:var(--sh-hover);}
.funnel__key{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--c-text-main);letter-spacing:.5px;}
.funnel__desc{font-size:12px;color:var(--c-text-secondary);margin-top:4px;}
.funnel__connector{width:2px;height:22px;background:var(--c-border);}
.funnel__stage--s1{width:88%;}
.funnel__stage--s2{width:78%;}
.funnel__stage--s3{width:66%;}
.funnel__stage--s4{width:54%;}
.funnel__stage--final{width:46%;background:var(--c-primary-100);border-color:var(--c-primary-700);}
.funnel__badge{position:absolute;top:-10px;right:-8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:var(--c-primary-700);color:#fff;padding:2px var(--s2);border-radius:var(--r-pill);}
.funnel__note{font-size:12px;color:var(--c-text-secondary);margin-top:var(--s2);max-width:220px;}
.funnel__final-note{font-size:13px;color:var(--c-primary-900);margin-top:var(--s3);line-height:1.5;}

/* ===== Module 02 · Assumption Shift Matrix ===== */
.matrix{display:grid;grid-template-columns:1fr 64px 1fr;gap:0;align-items:stretch;}
.matrix__col-head{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);font-weight:600;text-align:center;padding-bottom:var(--s3);}
.matrix__mid{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:var(--s2);}
.matrix__mid-line{width:1px;flex:1;background:var(--c-border);}
.matrix__mid-label{font-size:10px;letter-spacing:1px;color:var(--c-text-secondary);text-align:center;writing-mode:vertical-rl;}
.matrix__row{display:contents;}
.matrix__cell{border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3) var(--s4);margin:var(--s2);background:var(--c-card);transition:all .2s ease;cursor:default;position:relative;}
.matrix__cell:hover{box-shadow:var(--sh-hover);}
.matrix__cell--low{background:#F5F2EF;border-color:#E6DED5;}
.matrix__cell--elevated{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.matrix__cell-label{font-size:13px;color:var(--c-text-main);font-weight:500;}
.matrix__cell-grade{font-family:var(--f-mono);font-size:12px;color:var(--c-text-secondary);margin-top:2px;}
.matrix__priority{display:inline-block;margin-top:var(--s2);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--c-primary-900);background:var(--c-primary-100);border:1px solid var(--c-primary-500);padding:1px var(--s2);border-radius:var(--r-pill);}
/* tooltip 由全局 .pj-tooltip 统一渲染；旧 .matrix__hover-tip 移除 */
.key-insight__en{font-size:14px;color:var(--c-primary-900);font-weight:600;font-style:italic;line-height:1.5;}
.key-insight__zh{font-size:14px;color:var(--c-text-main);margin-top:var(--s2);}

/* ===== Module 02 v3 · Step Switcher Artifact ===== */
.nti{display:flex;flex-direction:column;}
.nti__top-line{height:1px;background:var(--c-border);margin-bottom:var(--s3);}
.nti__switcher{display:flex;align-items:stretch;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3);}
.nti__tab{flex:1;background:none;border:none;border-radius:var(--r-sm);padding:var(--s2) var(--s1);cursor:pointer;text-align:center;transition:background .18s ease;position:relative;}
.nti__tab:hover{background:var(--c-primary-100);}
.nti__tab.is-active::after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--c-primary-700);border-radius:2px;}
.nti__tab-idx{display:block;font-family:var(--f-mono);font-size:12px;color:var(--c-text-secondary);font-weight:600;}
.nti__tab.is-active .nti__tab-idx{color:var(--c-primary-700);}
.nti__tab-en{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);margin-top:2px;}
.nti__tab.is-active .nti__tab-en{color:var(--c-primary-700);}
.nti__tab-title{display:block;font-size:13px;color:var(--c-text-secondary);margin-top:2px;}
.nti__tab.is-active .nti__tab-title{color:var(--c-primary-900);font-weight:600;}
.nti__switcher{display:none;}
.nti__canvas{position:relative;display:flex;flex-direction:column;gap:var(--s5);}
.nti__pane{display:flex;flex-direction:column;gap:var(--s1);}
.nti__step-header{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s2) 0 var(--s2);margin-bottom:0;}
.nti__divider{height:1px;background:var(--c-border);margin:var(--s1) 0;}
.nti__step-idx{font-family:var(--f-mono);font-size:14px;color:var(--c-primary-700);font-weight:600;}
.nti__step-en{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;}
.nti__step-title{font-size:15px;color:var(--c-text-main);font-weight:600;}
/* modal view */
.nti--modal .nti__switcher{display:flex;align-items:stretch;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3);}
.nti--modal .nti__canvas{display:block;position:relative;min-height:320px;}
.nti--modal .nti__pane{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .3s ease, transform .3s ease;}
.nti--modal .nti__pane.is-active{opacity:1;pointer-events:auto;transform:translateY(0);position:relative;}
.nti__question{font-size:13px;color:var(--c-text-secondary);margin-bottom:var(--s2);}
.nti__voices{display:flex;flex-direction:column;gap:var(--s2);position:relative;padding:var(--s2) 0;min-height:180px;}
.nti__voice{display:flex;align-items:flex-start;gap:var(--s2);position:relative;}
.nti__voice.is-right{flex-direction:row-reverse;margin-left:auto;}
.nti__voice-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--c-primary-100);display:flex;align-items:center;justify-content:center;font-size:16px;}
.nti__voice-bubble{background:#fff;border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s2) var(--s3);box-shadow:var(--sh-card);max-width:260px;}
.nti__voice-bubble.is-right{background:var(--c-primary-100);border-color:rgba(199,161,142,.4);}
.nti__voice-role{font-size:11px;color:var(--c-text-secondary);margin-bottom:2px;}
.nti__voice-text{font-size:13px;color:var(--c-text-main);}
.nti__takeaways{margin-top:auto;display:flex;flex-direction:column;gap:var(--s2);}
.nti__takeaway{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--c-text-main);}
.nti__takeaway-mark{width:18px;height:18px;border-radius:50%;background:var(--c-success-bg);color:var(--c-success-dark);display:flex;align-items:center;justify-content:center;font-size:11px;}
.nti__fragments{position:relative;min-height:180px;margin-top:var(--s2);}
.nti__fragment{position:absolute;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-pill);padding:3px var(--s3);white-space:nowrap;transition:all .3s ease;}
.nti__fragment--normal{background:#fff;color:var(--c-text-secondary);border-color:var(--c-border);}
.nti__fragment--important{background:var(--c-primary-100);color:var(--c-primary-900);border-color:rgba(199,161,142,.5);}
.nti__fragment--core{background:transparent;border:none;color:var(--c-primary-900);font-weight:700;padding:0;}
.nti__listen-insight{margin-top:var(--s4);padding:var(--s4) var(--s5);border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-card);}
.nti__listen-insight-lead{font-size:13px;color:var(--c-text-secondary);margin-bottom:var(--s2);}
.nti__listen-insight-item{font-size:15px;color:var(--c-primary-900);font-weight:600;margin-bottom:var(--s1);}
.nti__shift-board{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s4) var(--s5);background:var(--c-card);margin-top:var(--s2);}
.nti__shift-title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;text-align:center;margin-bottom:var(--s4);}
.nti__shift-row{display:grid;grid-template-columns:1fr auto 30px auto;align-items:center;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px dashed var(--c-border);}
.nti__shift-row:last-child{border-bottom:none;}
.nti__shift-label{font-size:14px;color:var(--c-text-main);}
.nti__shift-from{font-size:12px;color:var(--c-text-secondary);background:var(--c-surface);padding:2px var(--s2);border-radius:var(--r-sm);}
.nti__shift-to{font-size:12px;color:var(--c-primary-900);background:var(--c-primary-100);padding:2px var(--s2);border-radius:var(--r-sm);font-weight:600;}
.nti__shift-arrow{color:var(--c-primary-500);font-size:14px;text-align:center;}
.nti__update-summary{margin-top:var(--s5);padding:var(--s3) var(--s4);background:var(--c-primary-100);border-left:3px solid var(--c-primary-700);border-radius:0 var(--r-md) var(--r-md) 0;font-size:14px;color:var(--c-primary-900);font-weight:600;}

/* ---------- Module 03 · Decision Tree (§8.2) ---------- */
.dt-wrap{margin-top:var(--s2);}
.dt-problem{background:var(--c-primary-100);border-left:3px solid var(--c-primary-700);border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--s4) var(--s5);font-size:14px;color:var(--c-text-main);}
.dt-problem__title{font-size:14px;font-weight:600;color:var(--c-primary-900);margin-bottom:var(--s2);}
.dt-problem__body{font-size:14px;color:var(--c-text-main);line-height:1.6;}
.dt-problem strong{color:var(--c-primary-900);font-weight:600;}
.dt-objectives{margin-top:var(--s5);padding-left:var(--s4);display:flex;flex-direction:column;gap:var(--s3);}
.dt-objective{display:flex;gap:var(--s2);font-size:14px;color:var(--c-text-main);line-height:1.5;}
.dt-objective__dot{color:var(--c-primary-700);font-weight:700;flex:0 0 auto;}
.dt-objective__text{flex:1;}
.dt-objective strong{color:var(--c-primary-900);font-weight:600;}
.dt-tag{font-size:11px;letter-spacing:.6px;color:var(--c-text-secondary);margin:var(--s4) 0 var(--s2);}
.dt-options{display:flex;flex-direction:column;gap:var(--s3);}
.dt-option{display:flex;gap:var(--s3);align-items:flex-start;border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s3) var(--s4);background:var(--c-card);}
.dt-option.is-chosen{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.dt-verdict{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.dt-verdict--x{background:var(--c-warning-bg);color:var(--c-warning-dark);border:1px solid var(--c-warning-border);}
.dt-verdict--ok{background:var(--c-success-bg);color:var(--c-success-dark);border:1px solid var(--c-success-border);}
.dt-option__main{flex:1;min-width:0;}
.dt-option__head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;}
.dt-option__tag{font-size:13px;font-weight:600;color:var(--c-primary-900);}
.dt-option__name{font-size:14px;color:var(--c-text-main);font-weight:600;}
.dt-option__reason{font-size:13px;color:var(--c-text-secondary);margin-top:2px;line-height:1.5;}
.dt-decompose{margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--c-border);}
.dt-decompose__title{font-size:11px;letter-spacing:.5px;color:var(--c-text-secondary);margin-bottom:6px;}
.dt-part{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-bottom:4px;}
.dt-part__idx{color:var(--c-primary-700);font-weight:600;font-family:var(--f-mono);}
.dt-part__tag{color:var(--c-text-main);font-weight:600;}
.dt-part__d{color:var(--c-text-secondary);}
.dt-decompose__note{font-size:12px;color:var(--c-text-secondary);margin-top:6px;line-height:1.5;}

/* ===== Module 03 · Product Blueprint ===== */
.blueprint{width:100%;}
.blueprint svg{width:100%;height:auto;display:block;}
.bp-node{cursor:default;transition:opacity .25s ease;}
.bp-node text{font-family:var(--f-sans);}
.bp-label{font-size:14px;font-weight:600;fill:var(--c-text-main);}
.bp-sub{font-size:12px;fill:var(--c-text-secondary);}
.bp-box{fill:var(--c-card);stroke:var(--c-border);stroke-width:1.2;}
.bp-box--center{fill:var(--c-card);}
.bp-box--accent{fill:var(--c-primary-100);stroke:var(--c-primary-700);}
.bp-box--core{fill:var(--c-primary-100);stroke:var(--c-primary-900);stroke-width:1.5;}
.bp-core-tag{font-size:11px;letter-spacing:1px;fill:var(--c-primary-900);text-transform:uppercase;}
.bp-link{stroke:var(--c-primary-500);stroke-width:1.4;fill:none;}
.bp-dim{opacity:.45;}
.interface-preview{margin-top:var(--s6);border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface);}
.interface-preview__label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);padding:var(--s3) var(--s4);border-bottom:1px solid var(--c-border);}
.ip-grid{display:grid;grid-template-columns:64px 1fr 96px;min-height:120px;}
.ip-col{padding:var(--s3);font-size:11px;color:var(--c-text-secondary);border-right:1px solid var(--c-border);}
.ip-col:last-child{border-right:none;}
.ip-col--nav{background:var(--c-header);}
.ip-col--mid{background:var(--c-card);}
.ip-col--trace{background:var(--c-header);}
.ip-answer{background:var(--c-primary-100);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:11px;color:var(--c-text-main);margin-bottom:var(--s2);}
.ip-step{font-family:var(--f-mono);font-size:10px;color:var(--c-text-secondary);padding:var(--s1) 0;border-bottom:1px dashed var(--c-border);}
.ip-bottom{display:flex;align-items:center;justify-content:center;gap:var(--s4);padding:var(--s4);border-top:1px solid var(--c-border);background:var(--c-card);position:relative;}
.ip-bottom__box{border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--c-card);font-size:12px;color:var(--c-text-main);min-width:112px;text-align:center;position:relative;}
.ip-bottom__box--accent{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.ip-bottom__arrow{display:flex;align-items:center;justify-content:center;}
.ip-bottom__arrow svg{width:18px;height:18px;display:block;}
.ip-up-arrow{position:absolute;top:-22px;left:50%;transform:translateX(-50%);display:block;}
.ip-up-arrow svg{width:18px;height:18px;display:block;}

/* ============ Module 04/05/06/08/09 左侧新叙事 kind ============ */
.art-sub{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);font-weight:600;margin-bottom:var(--s3);}
.t-dirs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s3);}
.t-dir{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s3);background:var(--c-card);transition:all .2s ease;}
.t-dir--off{opacity:.55;}
.t-dir--on{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.t-dir__tag{font-size:10px;letter-spacing:.5px;color:var(--c-primary-700);font-weight:600;}
.t-dir__name{font-size:14px;font-weight:600;color:var(--c-primary-900);margin-top:2px;}
.t-dir__desc{font-size:12px;color:var(--c-text-main);margin-top:2px;}
.t-dir__note{font-size:11px;color:var(--c-text-secondary);margin-top:4px;line-height:1.4;}
.t-dir__sel{margin-top:var(--s3);font-size:10px;letter-spacing:1px;color:var(--c-primary-900);background:#fff;border:1px solid var(--c-primary-500);border-radius:var(--r-pill);padding:1px 8px;display:inline-block;}
.t-dir__mark{margin-top:var(--s3);font-size:14px;color:var(--c-text-secondary);text-align:center;}
.t-flow{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);}
.t-flow__seg{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--c-text-main);background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s2) var(--s3);}
.t-flow__arrow{color:var(--c-primary-500);font-weight:700;}
.t-rule{display:flex;flex-direction:column;gap:2px;padding:var(--s2) 0;border-bottom:1px solid var(--c-border);}
.t-rule:last-child{border-bottom:none;}
.t-rule__tag{font-size:13px;font-weight:600;color:var(--c-primary-900);}
.t-rule__desc{font-size:13px;color:var(--c-text-secondary);}
.t-stats{display:flex;gap:var(--s6);flex-wrap:wrap;}
.t-stat__k{font-family:var(--f-mono);font-size:20px;color:var(--c-primary-900);font-weight:600;}
.t-stat__d{font-size:12px;color:var(--c-text-secondary);margin-top:2px;}
.t-question{display:flex;gap:var(--s3);align-items:baseline;padding:var(--s2) 0;}
.t-question__q{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-700);font-weight:700;flex:0 0 auto;}
.t-question__text{font-size:14px;color:var(--c-text-main);}
.t-page{font-size:14px;color:var(--c-text-main);padding:var(--s2) 0;border-bottom:1px dashed var(--c-border);}
.t-page:last-child{border-bottom:none;}
.t-dim{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--c-border);}
.t-dim:last-child{border-bottom:none;}
.t-dim__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-500);font-weight:600;flex:0 0 auto;}
.t-dim__tag{font-size:14px;font-weight:600;color:var(--c-text-main);}
.t-dim__desc{font-size:13px;color:var(--c-text-secondary);margin-top:2px;}
.t-deliv{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--c-border);}
.t-deliv:last-child{border-bottom:none;}
.t-deliv__idx{font-family:var(--f-mono);font-size:13px;color:var(--c-primary-700);font-weight:600;flex:0 0 auto;padding-top:2px;}
.t-deliv__tag{font-size:14px;font-weight:600;color:var(--c-primary-900);}
.t-deliv__desc{font-size:13px;color:var(--c-text-secondary);margin-top:2px;}

/* ============ Module 04 · Visual Gallery Artifact ============ */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);}
.gal__dir{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s4);background:var(--c-card);transition:all .2s ease;}
.gal__dir--on{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.gal__dir--off{background:#FAFAF8;border-color:#E8E4E0;}
.gal__dir--off .gal__dir-name{font-size:13px;font-weight:600;color:#9E918A;}
.gal__dir--off .gal__dir-kw{font-size:12px;color:#B5AAA3;margin-top:2px;}
.gal__dir-name{font-size:13px;font-weight:600;color:var(--c-primary-900);}
.gal__dir-kw{font-size:12px;color:var(--c-text-secondary);margin-top:2px;}
.gal__sw{display:flex;gap:4px;margin-top:var(--s3);}
.gal__swatch{width:22px;height:14px;border-radius:3px;border:1px solid rgba(62,56,54,.08);}
.gal__sel{margin-top:var(--s3);font-size:10px;letter-spacing:1px;color:var(--c-primary-900);background:#fff;border:1px solid var(--c-primary-500);border-radius:var(--r-pill);padding:1px 8px;display:inline-block;}

/* ===== Module 04 · Left: Visual Direction + Color Usage ===== */
.vd-wrap{display:flex;flex-direction:column;gap:var(--s4);}
.vd-usage{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s4);background:var(--c-card);}
.vd-usage__title{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--c-text-secondary);margin-bottom:var(--s3);}
.vd-usage__bar{display:flex;height:18px;border-radius:var(--r-pill);overflow:hidden;border:1px solid var(--c-border);background:#fff;}
.vd-usage__seg{display:flex;align-items:center;justify-content:center;min-width:0;border-right:1px solid rgba(62,56,54,.12);position:relative;}
.vd-usage__seg:last-child{border-right:none;}
.vd-usage__pct{font-size:10px;font-weight:700;white-space:nowrap;}
.vd-usage__seg--light .vd-usage__pct{color:var(--c-text-main);}
.vd-usage__seg--dark .vd-usage__pct{color:#fff;text-shadow:0 1px 2px rgba(62,56,54,.25);}
.vd-usage__legend{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s5);margin-top:var(--s4);}
.vd-usage__item{display:flex;align-items:center;gap:6px;}
.vd-usage__dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(62,56,54,.12);flex:0 0 auto;}
.vd-usage__label{display:flex;flex-direction:column;line-height:1.7;}
.vd-usage__label b{font-size:11px;color:var(--c-text-main);font-weight:400;}
.vd-usage__label i{font-size:10px;color:var(--c-text-secondary);font-style:normal;}

/* ===== Module 04 · Design System Preview (merged module) ===== */
.ds-board{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-md);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);
  box-shadow:0 1px 3px rgba(62,56,54,.05);}
.ds-sec{padding:var(--s3) 0;}
.ds-sec__title{font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--c-primary-700);
  margin-bottom:var(--s3);text-transform:uppercase;}
/* A. Color — 4 swatches per row */
.ds-color{display:flex;flex-direction:column;gap:var(--s3);}
.ds-color__label{font-size:10px;letter-spacing:1px;color:var(--c-text-secondary);font-weight:700;margin-bottom:6px;}
.ds-color__scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ds-color__cell{display:flex;flex-direction:column;gap:3px;min-width:0;}
.ds-color__chip{width:100%;height:36px;border-radius:var(--r-sm);border:1px solid rgba(62,56,54,.1);flex:0 0 auto;}
.ds-color__chip--split{background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);border:none;box-shadow:inset 0 0 0 1px rgba(62,56,54,.12);}
.ds-color__n{font-size:10px;font-weight:700;color:var(--c-text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ds-color__hex{font-size:8px;color:#6B5045;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ds-color__hex-main,.ds-color__hex-bg{color:#6B5045;font-weight:400;}
/* B. Typography + C. Spacing */
.ds-2col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) 0;}
.ds-2col > section:first-child{border-right:1px solid var(--c-border);padding-right:var(--s4);}
.ds-2col > section:last-child{padding-left:var(--s4);}
.ds-type{display:flex;flex-direction:column;}
.ds-type__row{padding:6px 0;border-bottom:1px dashed var(--c-border);}
.ds-type__row:last-child{border-bottom:none;}
.ds-type__sample{color:var(--c-text-main);word-break:break-word;}
.ds-type__meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;}
.ds-type__label{font-size:10px;color:var(--c-text-secondary);font-weight:600;letter-spacing:.5px;}
.ds-type__mono{font-size:9px;color:#6B5045;font-weight:400;}
.ds-space{display:flex;flex-direction:column;gap:4px;}
.ds-space__row{display:flex;align-items:center;gap:8px;}
.ds-space__num{font-size:11px;color:#6B5045;width:22px;font-weight:400;flex:0 0 auto;}
.ds-space__bar{height:8px;background:var(--c-primary-500);border-radius:2px;min-width:8px;max-width:100%;}
.ds-space__base{font-size:10px;color:#6B5045;font-weight:400;margin-top:6px;letter-spacing:.5px;}
.ds-space__usage{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.ds-space__use{display:flex;justify-content:space-between;font-size:11px;gap:8px;}
.ds-space__use b{color:var(--c-text-main);font-weight:600;}
.ds-space__use span{color:#6B5045;font-weight:400;}
/* D. Components */
.ds-comp{display:flex;flex-direction:column;gap:var(--s3);}
.ds-comp__row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;}
.ds-comp__row--split{align-items:stretch;}
.ds-comp__group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.ds-comp__group > .ds-comp__row{justify-content:center;}
.ds-comp__label{font-size:10px;color:#6B5045;font-weight:400;text-align:center;letter-spacing:.5px;}
.ds-btn{font-size:13px;padding:8px 16px;border-radius:var(--r-sm);cursor:default;border:1px solid transparent;font-family:inherit;line-height:1;}
.ds-btn--primary{background:var(--c-primary-700);color:#fff;}
.ds-btn--secondary{background:#fff;color:var(--c-primary-900);border-color:var(--c-primary-500);}
.ds-card{flex:1;min-width:120px;background:#fff;border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s3);}
.ds-card__title{font-size:13px;font-weight:600;color:var(--c-primary-900);margin-bottom:4px;}
.ds-card__body{font-size:12px;color:var(--c-text-secondary);line-height:1.5;}
.ds-chat{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.ds-chat__row{display:flex;align-items:flex-end;gap:8px;}
.ds-chat__row--user{justify-content:flex-end;}
.ds-chat__row--bot{justify-content:flex-start;}
.ds-chat__avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;}
.ds-chat__avatar--user{background:#C7A18E;color:#fff;font-size:13px;font-weight:600;}
.ds-chat__avatar--bot{background:#fff;border:1px solid var(--c-border);font-size:14px;}
.ds-chat__bubble{border-radius:var(--r-md);padding:10px 14px;font-size:13px;line-height:1.55;max-width:78%;box-shadow:0 1px 2px rgba(62,56,54,.04);}
.ds-chat__bubble--user{background:#F5EFE8;color:var(--c-text-main);border-bottom-right-radius:5px;}
.ds-chat__bubble--bot{background:#fff;border:1px solid var(--c-border);border-bottom-left-radius:5px;}

/* ============ Module 05 · Knowledge Architecture Artifact ============ */
.arch__cats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.arch__cat{border:1px solid var(--c-border);border-left:3px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--c-card);display:flex;align-items:center;gap:var(--s3);}
.arch__cat-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.arch__cat-tag{font-size:13px;font-weight:600;color:var(--c-text-main);}
.arch__meta{display:flex;gap:var(--s3);flex-wrap:wrap;}
.arch__meta-item{font-size:12px;letter-spacing:.5px;color:var(--c-primary-900);background:var(--c-primary-100);border:1px solid var(--c-border);border-radius:var(--r-pill);padding:2px var(--s3);}
.arch__graph{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s5);background:var(--c-card);margin-top:var(--s3);}
.arch__demo-figure{position:relative;display:block;margin:0 0 var(--s4) 0;cursor:zoom-in;}
.arch__demo-figure:last-child{margin-bottom:0;}
.arch__demo-img{display:block;width:100%;height:auto;border-radius:var(--r-sm);}
.arch__zoom-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:rgba(62,56,54,.55);color:#fff;opacity:0;transition:opacity 200ms var(--ease);pointer-events:none;box-shadow:0 4px 12px rgba(62,56,54,.25);}
.arch__demo-figure:hover .arch__zoom-hint{opacity:1;}
.arch__demo-img:last-child{margin-bottom:0;}
.arch__gnode{display:flex;align-items:center;gap:var(--s3);}
.arch__gnode--root{justify-content:center;margin-bottom:var(--s2);}
.arch__edge{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0;padding-left:40px;}
.arch__g-rel{font-size:12px;color:var(--c-text-secondary);min-width:96px;}
.arch__g-arrow{color:var(--c-primary-500);font-weight:700;}
.arch__gnode--leaf{border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s2) var(--s4);background:var(--c-card);}
.arch__g-label{font-size:13px;font-weight:600;color:var(--c-text-main);}
.arch__g-sub{font-size:11px;color:var(--c-text-secondary);}

/* ============ Module 06 · Interface Showcase Artifact ============ */
.iface__tabs{display:flex;gap:var(--s2);border-bottom:1px solid var(--c-border);margin-bottom:var(--s5);}
.iface__tab{font-family:var(--f-sans);font-size:13px;font-weight:600;color:var(--c-text-secondary);background:none;border:none;border-bottom:2px solid transparent;padding:var(--s2) var(--s3);cursor:pointer;transition:all .18s ease;}
.iface__tab.is-active{color:var(--c-primary-900);border-bottom-color:var(--c-primary-700);}
.iface__panel{display:none;position:relative;}
.iface__panel.is-active{display:block;}
.iface__hotspots{position:absolute;inset:0;pointer-events:none;}
.iface__hotspot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:2px solid var(--c-primary-700);background:rgba(255,255,255,.85);color:var(--c-primary-900);font-size:11px;font-weight:700;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-hover);}
.iface__tip{font-size:12px;color:var(--c-text-secondary);margin-top:var(--s4);min-height:18px;}
.if-screen{border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface);}
.if-mock{padding:var(--s4);}
.if-nav{font-size:11px;color:var(--c-text-secondary);background:var(--c-header);margin:-16px -16px 12px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--c-border);}
.if-chat{display:flex;flex-direction:column;gap:var(--s2);}
.if-bubble{border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:13px;line-height:1.5;max-width:85%;}
.if-bubble--user{align-self:flex-end;background:var(--c-primary-100);color:var(--c-text-main);}
.if-bubble--bot{align-self:flex-start;background:var(--c-card);border:1px solid var(--c-border);}
.if-tag{display:inline-block;margin-left:6px;font-size:10px;color:var(--c-primary-700);background:var(--c-primary-100);border-radius:var(--r-pill);padding:1px 6px;}
.if-trace{margin-top:var(--s2);font-family:var(--f-mono);font-size:11px;color:var(--c-text-secondary);background:var(--c-header);border-radius:var(--r-sm);padding:var(--s2) var(--s3);}
.if-legend{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap;}
.if-lg{font-size:11px;padding:1px var(--s3);border-radius:var(--r-pill);border:1px solid var(--c-border);}
.if-lg--c{color:#C08A6A;border-color:#E6D2C4;}
.if-lg--m{color:#C99A3E;border-color:#EAD9B6;}
.if-lg--d{color:#6D8795;border-color:#CFDCE3;}
.if-lg--i{color:#6E9277;border-color:#CFE0D4;}
.if-graphsvg svg{width:100%;height:auto;display:block;}
.if-detail{font-size:12px;color:var(--c-text-secondary);margin-top:var(--s3);}
.if-search{font-size:12px;color:var(--c-text-secondary);background:var(--c-header);border-radius:var(--r-sm);padding:var(--s3);margin-bottom:var(--s3);}
.if-litcards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.if-litcard{border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--s3);font-size:12px;color:var(--c-text-main);background:var(--c-card);}

/* ============ Module 07 · System Architecture Artifact ============ */
.sys__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);}
.sys__title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c-primary-700);font-weight:600;}
.sys__badge{font-size:11px;color:var(--c-success-dark);background:var(--c-success-bg);border:1px solid var(--c-success-border);border-radius:var(--r-pill);padding:2px var(--s3);}
.sys__stack{display:flex;flex-direction:column;}
.sys__layer{position:relative;border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s4) var(--s5);background:var(--c-card);transition:box-shadow .2s ease, transform .2s ease;}
.sys__layer--accent{background:var(--c-primary-100);border-color:var(--c-primary-500);}
.sys__layer--surface{background:var(--c-surface);}
.sys__layer:hover{box-shadow:var(--sh-hover);transform:translateY(-1px);}
.sys__layer-name{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--c-text-main);}
.sys__layer-sub{font-size:13px;color:var(--c-text-secondary);margin-top:2px;}
.sys__layer-files{font-size:11px;color:var(--c-text-secondary);font-family:var(--f-mono);margin-top:4px;}
.sys__conn{text-align:center;color:var(--c-primary-500);font-size:12px;padding:2px 0;letter-spacing:2px;}
.sys__io{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin-top:var(--s5);flex-wrap:wrap;}
.sys__io-col{text-align:center;}
.sys__io-label{font-size:11px;letter-spacing:1px;color:var(--c-primary-700);font-weight:600;}
.sys__io-text{font-size:12px;color:var(--c-text-secondary);max-width:200px;margin-top:2px;}
.sys__io-arrow{font-size:12px;color:var(--c-primary-700);font-weight:600;}

/* ============ Module 07 · Development Roadmap（右栏） ============ */
.rdm__head{padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:var(--s4);}
.rdm__title{font-size:14px;font-weight:600;color:#6B5045;}
.rdm__main{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;padding:2px 2px 8px;}
.rdm__cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;}
.rdm__node{width:100%;max-width:120px;height:48px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #D7CFC7;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:#3E3836;text-align:center;box-sizing:border-box;transition:border-color .2s ease, background .2s ease;}
.rdm__arrow{flex:0 0 auto;align-self:flex-start;margin-top:17px;color:#C7A18E;font-size:15px;font-weight:700;line-height:1;}
.rdm__outs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;}
.rdm__pill{background:#FAF3EC;color:#6B5045;font-size:11px;border-radius:999px;padding:4px 10px;white-space:nowrap;transition:border-color .2s ease, background .2s ease;}
.rdm__sub{display:flex;flex-direction:column;align-items:center;width:100%;}
.rdm__sub-line{flex:0 0 auto;width:1px;height:14px;background:#E5DDD5;}
.rdm__step{width:100%;max-width:160px;height:36px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #E5DDD5;border-radius:6px;padding:0 10px;font-size:12px;color:#3E3836;text-align:center;box-sizing:border-box;}
.rdm__sub-v{flex:0 0 auto;color:#E5DDD5;font-size:12px;line-height:1;margin:6px 0;}
.rdm__cell:hover .rdm__node{background:#FAF3EC;border-color:#8C6B5D;}
.rdm__cell:hover .rdm__pill{background:#FFF;border:1px solid #C7A18E;}

/* ============ Module 07 · Frontend Architecture（右栏） ============ */
.fea__head{padding-bottom:8px;border-bottom:1px solid #E5DDD5;margin-bottom:12px;}
.fea__title{font-size:14px;font-weight:600;color:#6B5045;}
.fea__list{display:flex;flex-direction:column;gap:12px;}
.fea__card{background:#FFFFFF;border:1px solid #E5DDD5;border-radius:8px;padding:12px 14px;transition:border-color .15s ease, box-shadow .15s ease;}
.fea__card:hover{border-color:#D7CFC7;box-shadow:0 2px 6px rgba(62,56,54,0.04);}
.fea__top{display:flex;flex-direction:column;gap:2px;}
.fea__name{font-size:14px;font-weight:600;color:#3E3836;}
.fea__use{font-size:12px;color:#6F6763;}
.fea__comps{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px;padding-top:10px;border-top:1px solid #EDE5DD;}
.fea__pill{background:#FAF3EC;color:#6B5045;font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.fea__notes{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;border-top:1px solid #EDE5DD;}
.fea__note{font-size:12px;color:#6F6763;line-height:16px;}
.fea__note::before{content:"●";color:#C7A18E;margin-right:6px;font-size:9px;vertical-align:1px;}
.fea__note--src{font-weight:600;}
.fea__note--src::before{content:"▶";}

/* ============ Module 07 · 左侧三级结构 ============ */
/* 一级章节：标题带 + 交替背景 */
.m07-sec__head{padding:20px 24px;border-bottom:1px solid #E5DDD5;}
.m07-sec__head--apricot{background:#FAF3EC;}
.m07-sec__title{font-size:14px;font-weight:600;color:#6B5045;letter-spacing:.5px;margin-bottom:10px;}
.m07-sec__intro{font-size:13px;color:#3E3836;line-height:1.6;margin:0;}
.m07-sec{margin-bottom:18px;}
.m07-sec__body{padding:20px 24px;background:#FFFFFF;}
.m07-sec__body > .m07-sub:first-child{margin-top:0;}

/* 二级子区块：左缩进 + 左侧 2px 竖线 */
/* TECH STACK 子区块：主标题 + 缩进内容 + 竖线（对齐标题首字中间 ~7px） */
.m07-sub{margin-top:28px;}
.m07-sub__title{font-size:14px;font-weight:600;color:#3E3836;}
.m07-sub__desc{font-size:12px;color:#6F6763;margin-top:2px;margin-bottom:14px;}
.m07-sub__body{margin-top:12px;margin-left:7px;padding-left:16px;border-left:2px solid #E5DDD5;}
.m07-sub--plain .m07-sub__body{margin-left:0;padding-left:0;border-left:none;}

/* CONCEPT · 开发理念 段落 */
.m07-concept{font-size:13px;color:#3E3836;line-height:1.6;margin:0;}

/* 01/02/03 · 修改前样式（实现 / 调度 / 贯通） */
.eng-sec{margin-bottom:calc(var(--s6) * 1.5);}
.eng-sec__label{display:inline-block;font-size:14px;font-weight:600;color:var(--c-primary-900);font-family:var(--f-mono),ui-monospace,monospace;letter-spacing:.5px;padding-bottom:6px;border-bottom:1px solid #E5DDD5;margin-bottom:calc(var(--s4) * 1.05);}
.eng-sec__desc{font-size:13px;color:var(--c-text-secondary);margin-top:2px;margin-bottom:var(--s4);}

/* 01 实现 · 映射表：无边框双列，细行线分隔 */
.eng-map{display:flex;flex-direction:column;}
.eng-map__row{display:flex;align-items:baseline;gap:var(--s3);padding:9px 0;border-bottom:1px solid #E5DDD5;}
.eng-map__asset{font-size:13px;font-weight:600;color:var(--c-text-main);flex:0 0 auto;min-width:140px;padding-right:var(--s3);}
.eng-map__input{font-size:13px;color:var(--c-text-main);flex:1 1 auto;border-left:1px solid #E5DDD5;padding-left:var(--s3);}
.eng-map__note{font-size:11px;color:var(--c-text-secondary);line-height:1.5;margin:2px 0 6px;}

/* 02 调度 · 圆点列表（去掉 wrapper，改为条目间距）+ 模块依赖胶囊链 */
.eng-dotlist__item{display:flex;gap:var(--s3);margin-bottom:var(--s6);}
.eng-sec > .eng-dotlist__item:last-child{margin-bottom:0;}
.eng-dep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:var(--s6);}
.eng-dep__pill{display:inline-block;background:#FAF3EC;border:1px solid #E5DDD5;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:400;color:var(--c-text-main);white-space:nowrap;}
.eng-dep__arrow{color:#C7A18E;font-weight:700;flex:0 0 auto;}
.eng-dotlist__dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--c-primary-500);margin-top:7px;}
.eng-dotlist__body{display:flex;flex-direction:column;gap:2px;}
.eng-dotlist__t{font-size:13px;font-weight:600;color:var(--c-text-main);}
.eng-dotlist__d{font-size:13px;color:var(--c-text-main);line-height:1.55;}

/* 03 贯通 · 集成点 */
.eng-intg{display:flex;flex-direction:column;gap:var(--s4);}
.eng-intg__item{display:flex;flex-direction:column;gap:2px;}
.eng-intg__t{font-size:13px;font-weight:600;color:#3E3836;display:flex;align-items:center;gap:var(--s2);}
.eng-intg__ico{flex:0 0 auto;fill:currentColor;}
.eng-intg__d{font-size:12px;color:var(--c-text-secondary);line-height:1.55;}

/* 01 实现 · 箭头列表 */
.m07-arrowlist{display:flex;flex-direction:column;}
.m07-arrowlist__row{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
.m07-arrowlist__asset{font-size:13px;font-weight:600;color:#3E3836;flex:0 0 auto;}
.m07-arrowlist__arrow{color:#C7A18E;font-weight:700;flex:0 0 auto;}
.m07-arrowlist__input{font-size:13px;color:#3E3836;}

/* 02 调度 · 圆点列表 + 模块依赖链 */
.m07-dotlist{display:flex;flex-direction:column;gap:20px;margin-bottom:20px;}
.m07-dotlist__item{display:flex;gap:10px;}
.m07-dotlist__dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#C7A18E;margin-top:6px;}
.m07-dotlist__body{display:flex;flex-direction:column;gap:2px;}
.m07-dotlist__t{font-size:13px;font-weight:600;color:#3E3836;}
.m07-dotlist__d{font-size:13px;color:#3E3836;line-height:1.5;}
.m07-chain{display:flex;flex-direction:column;align-items:stretch;}
.m07-chain__node{align-self:flex-start;background:#FFFFFF;border:1px solid #D7CFC7;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;color:#3E3836;}
.m07-chain__arrow{color:#E5DDD5;text-align:center;font-size:14px;line-height:1;margin:12px 0;}

/* 03 贯通 · 2×2 卡组 */
.m07-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.m07-card{background:#FFFFFF;border:1px solid #E5DDD5;border-radius:8px;padding:16px;}
.m07-card__t{font-size:13px;font-weight:600;color:#3E3836;margin-bottom:4px;}
.m07-card__d{font-size:11px;color:#6F6763;line-height:1.5;}

/* 模型协作策略 · 三列表格 */
.m07-table{display:flex;flex-direction:column;width:100%;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-card);}
.m07-table__row{display:grid;grid-template-columns:130px 190px 1fr;gap:0;align-items:stretch;border-bottom:1px solid var(--c-border);}
.m07-table__row:last-child{border-bottom:none;}
.m07-table__role,.m07-table__model,.m07-table__duty{padding:var(--s3) var(--s4);display:flex;align-items:center;flex-wrap:wrap;line-height:1.5;}
.m07-table__role,.m07-table__model{border-right:1px solid var(--c-border);}
.m07-table__role{font-size:13px;font-weight:600;color:var(--c-text-main);background:var(--c-primary-100);}
.m07-table__model{font-size:13px;font-weight:500;color:var(--c-primary-900);}
.m07-table__duty{font-size:12px;color:var(--c-text-secondary);}
@media (max-width:640px){
  .m07-table__row{grid-template-columns:1fr;gap:var(--s2);padding:var(--s3) var(--s4);}
  .m07-table__role,.m07-table__model,.m07-table__duty{padding:var(--s1) 0;border-right:none;}
  .m07-table__role{background:transparent;padding-top:0;}
  .m07-table__duty{padding-bottom:0;}
}

/* 核心技术栈 · 标签列表 */
.m07-tags{display:flex;flex-direction:column;gap:16px;}
.m07-tag{display:flex;flex-direction:column;gap:2px;}
.m07-tag__name{font-size:13px;font-weight:600;color:#3E3836;}
.m07-tag__d{font-size:12px;color:#6F6763;line-height:1.5;}

/* 部署与运维 · 竖排流水线 */
.m07-pipe{display:flex;flex-direction:column;align-items:flex-start;}
.m07-pipe__node{display:flex;flex-direction:column;gap:2px;border:1px solid #D7CFC7;border-radius:6px;padding:8px 12px;}
.m07-pipe__node--aux{background:#FAF3EC;border-style:dashed;}
.m07-pipe__name{font-size:13px;font-weight:600;color:#3E3836;}
.m07-pipe__d{font-size:11px;color:#6F6763;line-height:1.4;}
.m07-pipe__row{display:flex;align-items:center;gap:8px;}
.m07-pipe__arrow{color:#C7A18E;font-weight:700;align-self:center;}
.m07-pipe__vdown{color:#C7A18E;font-size:12px;line-height:1;margin:8px 0 8px 10px;}

/* KEY INSIGHT 高亮块 */
.m07-ki{background:#FAF3EC;border-left:4px solid #8C6B5D;border-radius:8px;padding:16px;}
.m07-ki__body{font-size:13px;color:#3E3836;line-height:1.6;}

/* ============ Module 08 · Proof Matrix Artifact ============ */
.proof__summary{display:flex;gap:var(--s8);margin-bottom:var(--s2);}
.proof__sum-k{font-family:var(--f-mono);font-size:28px;color:var(--c-primary-900);line-height:1;}
.proof__sum-d{font-size:12px;color:var(--c-text-secondary);margin-top:4px;}
.proof__list{display:flex;flex-direction:column;gap:var(--s2);}
.proof__row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s3) var(--s4);background:var(--c-card);transition:box-shadow .18s ease;}
.proof__row--expandable{cursor:pointer;}
.proof__row--expandable:hover{box-shadow:var(--sh-hover);}
.proof__row--open{border-color:var(--c-primary-500);}
.proof__row-main{min-width:0;}
.proof__row-s{font-size:14px;font-weight:600;color:var(--c-text-main);}
.proof__row-input{font-size:12px;color:var(--c-text-secondary);margin-top:2px;}
.proof__status{font-size:12px;font-weight:600;padding:2px var(--s3);border-radius:var(--r-pill);white-space:nowrap;}
.proof__status--pass{color:var(--c-success-dark);background:var(--c-success-bg);border:1px solid var(--c-success-border);}
.proof__status--info{color:var(--c-info-dark);background:var(--c-info-bg);border:1px solid var(--c-info-border);}
.proof__status--warn{color:var(--c-warning-dark);background:var(--c-warning-bg);border:1px solid var(--c-warning-border);}
.proof__acc{margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--c-border);display:flex;flex-direction:column;gap:var(--s2);}
.proof__acc-row{font-size:12px;color:var(--c-text-main);}
.proof__acc-row span{display:inline-block;min-width:72px;color:var(--c-text-secondary);font-family:var(--f-mono);font-size:11px;}

/* ============ Module 09 · Deployment Artifact ============ */
.deploy__live{display:inline-block;font-size:11px;color:var(--c-success-dark);background:var(--c-success-bg);border:1px solid var(--c-success-border);border-radius:var(--r-pill);padding:2px var(--s3);margin-bottom:var(--s4);animation:breathe 3s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1;}50%{opacity:.55;}}
.deploy__map{display:flex;flex-direction:column;align-items:center;}
.deploy__node{border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--s3) var(--s5);background:var(--c-card);text-align:center;min-width:180px;}
.deploy__node--infra{border-style:dashed;background:var(--c-surface);}
.deploy__node-label{font-size:14px;font-weight:600;color:var(--c-text-main);}
.deploy__node-sub{font-size:12px;color:var(--c-text-secondary);margin-top:2px;}
.deploy__conn{color:var(--c-primary-500);font-size:16px;line-height:1;padding:2px 0;}
.deploy__infra{display:flex;flex-direction:column;align-items:center;}
.deploy__outcome{margin-top:var(--s6);border-top:1px solid var(--c-border);padding-top:var(--s4);}
.deploy__out-title{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c-text-secondary);font-weight:600;margin-bottom:var(--s3);}
.deploy__out-item{display:flex;align-items:center;gap:var(--s3);font-size:14px;color:var(--c-text-main);padding:var(--s1) 0;}
.deploy__check{color:var(--c-primary-700);font-weight:700;}
.deploy__out-item--live .deploy__dot{color:var(--c-success-dark);}
.deploy__done{font-size:13px;color:var(--c-text-secondary);margin-top:var(--s2);}
.deploy__fromto{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin-top:var(--s5);flex-wrap:wrap;}
.deploy__ft-label{font-size:11px;letter-spacing:1px;color:var(--c-primary-700);font-weight:600;}
.deploy__ft-text{font-size:12px;color:var(--c-text-secondary);max-width:200px;margin-top:2px;text-align:center;}
.deploy__ft-arrow{color:var(--c-primary-700);font-weight:600;}
.deploy__end{margin-top:var(--s6);text-align:center;font-size:13px;color:var(--c-primary-900);font-weight:600;}

/* ============ 05 · Navigation ============ */
.pj-nav{display:flex;align-items:center;justify-content:space-between;padding:var(--s8) 0 var(--s2);border-top:1px solid var(--c-border);margin-top:var(--s4);}
.nav-btn{display:inline-flex;align-items:center;gap:var(--s2);background:none;border:none;cursor:pointer;font-family:var(--f-sans);font-size:14px;color:var(--c-text-secondary);transition:color .2s ease, transform .2s ease;padding:var(--s2) 0;}
.nav-btn:hover{color:var(--c-primary-700);}
.nav-btn--prev:hover{transform:translateX(-4px);}
.nav-btn--next:hover{transform:translateX(4px);}
.nav-btn[disabled]{opacity:.35;cursor:not-allowed;transform:none;}
.nav-btn__label{font-size:12px;color:var(--c-text-secondary);}
.nav-btn__title{font-size:14px;color:var(--c-text-main);font-weight:600;}
.nav-btn--next{flex-direction:row-reverse;}

/* ============ Modal ============ */
.modal-mask{position:fixed;inset:0;background:rgba(62,56,54,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--s6);}
.modal-mask.is-open{display:flex;animation:demoFadeIn 300ms var(--ease) both;}
.modal-mask.is-closing{display:flex;animation:demoFadeOut 300ms var(--ease) both;}
.modal-box{position:relative;background:var(--c-card);border-radius:var(--r-lg);max-width:90vw;max-height:90vh;box-shadow:0 20px 60px rgba(62,56,54,.25);display:flex;flex-direction:column;opacity:0;}
.modal-mask.is-open .modal-box{animation:demoIn 300ms var(--ease) both;}
.modal-mask.is-closing .modal-box{animation:demoOut 150ms var(--ease) both;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);padding:var(--s6) var(--s6) var(--s4);}
.modal-box__title{font-size:16px;font-weight:600;color:var(--c-primary-900);margin:0;flex:1;}
.modal-close{position:relative;background:none;border:none;font-size:20px;color:var(--c-text-secondary);cursor:pointer;line-height:1;flex-shrink:0;}
.modal-scroll{overflow:auto;padding:0 var(--s6) var(--s6);}

/* ============ Pending placeholder ============ */
.pending-note{text-align:center;color:var(--c-text-secondary);font-size:14px;padding:var(--s12) 0;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
  .reveal-item{opacity:1 !important;transform:none !important;}
}

/* ============ Responsive ============ */
@media (min-width:1200px){
  .journey-band{gap:var(--s4);}
  .journey-divider{margin:0 var(--s4);}
  .j-node{padding:6px 2px;}
  .j-dot{width:34px;height:34px;font-size:14px;}
  .j-title{max-width:56px;font-size:10px;}
  .j-link{width:22px;margin:0 var(--s2);margin-top:16px;}
  .playhead span{font-size:12px;}
  .btn-autoplay{flex-direction:row;gap:6px;padding:var(--s2) var(--s3);font-size:13px;}
  .btn-autoplay__ico{font-size:13px;}
  .btn-autoplay__txt{font-size:13px;}
}
@media (max-width:768px){
  .pj-header{flex-direction:column;align-items:flex-start;gap:var(--s4);}
  .pj-header__tags{justify-content:flex-start;}
  .module-workspace{grid-template-columns:1fr;gap:var(--s8);}
  .journey-band{flex-direction:column;align-items:flex-start;gap:var(--s3);}
  .journey-track{flex-direction:column;gap:var(--s4);}
  .journey-segment{flex-direction:row;align-items:center;gap:var(--s4);}
  .segment-label{width:96px;flex:0 0 auto;margin-bottom:0;font-size:11px;}
  .segment-nodes{flex-wrap:wrap;}
  .journey-divider{width:auto;height:1px;align-self:stretch;margin:0;}
  .j-link{width:24px;margin:0 var(--s1);}
  .playhead{display:none;}
  .artifact{min-height:auto;}
}
@media (max-width:720px){

}
.pj-tooltip{position:fixed;z-index:9999;background:#FFFFFF;color:#3E3836;border:1px solid #EDE5DD;border-radius:6px;padding:6px 8px;font-size:12px;line-height:18px;box-shadow:0 4px 12px rgba(62,56,54,0.10);pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity 100ms ease, transform 100ms ease;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;}

/* ============ 面板入场与出场效果（与 style-demo 弹窗一致） ============ */
@keyframes demoFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes demoFadeOut{from{opacity:1;}to{opacity:0;}}

@keyframes demoOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(12px);}}
