<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献库</title>
<style>
:root{
  --bg-page:#FDFBF7;
  --bg-card:rgba(255,255,255,0.55);
  --bg-hover:#FFFFFF;
  --bg-chip:#FAF3EC;
  --bg-thumb:#FAF3EC;
  --text-main:#3E3836;
  --text-secondary:#6F6763;
  --text-muted:#9A918B;
  --primary:#8C6B5D;
  --primary-hover:#6B5045;
  --primary-light:#FAF3EC;
  --border:#EDE5DD;
  --border-hover:#C7B8AE;
  --shadow-hover:0 8px 28px rgba(62,56,54,0.10);
  --radius-md:12px;
  --radius-sm:8px;
  --gap:24px;
  --max-width:1440px;
}

* { box-sizing: border-box; }

html{
  overflow-y:scroll;
  scrollbar-width:thin;
  scrollbar-color:rgba(111,103,99,0.2) transparent;
}

html.scroll-medium{
  scrollbar-color:rgba(111,103,99,0.5) transparent;
}

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(111,103,99,0.2);
  border-radius:4px;
  transition:background .2s ease;
}

html.scroll-medium::-webkit-scrollbar-thumb{
  background:rgba(111,103,99,0.5);
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(111,103,99,1);
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg-page);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--text-main);
  line-height:1.55;
}

.library-shell{
  max-width:var(--max-width);
  margin:0 auto;
  padding:32px 36px 40px;
}

.library-header{
  margin-bottom:28px;
}

.library-title{
  font-size:28px;
  font-weight:600;
  color:var(--text-main);
  margin:0 0 6px;
  letter-spacing:-0.02em;
}

.library-subtitle{
  font-size:14px;
  color:var(--text-secondary);
  margin:0;
}

.library-toolbar{
  margin-bottom:24px;
}

.search-box{
  position:relative;
  max-width:560px;
}

.search-box input{
  width:100%;
  padding:11px 14px 11px 40px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;
  font-size:14px;
  color:var(--text-main);
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}

.search-box input::placeholder{ color:var(--text-muted); }
.search-box input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(140,107,93,0.08);
}

.search-icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.results-meta{
  font-size:13px;
  color:var(--text-secondary);
  margin-bottom:18px;
}

.results-meta strong{
  color:var(--text-main);
  font-weight:600;
}

.doc-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(500px, 1fr));
  grid-auto-rows:1fr;
  gap:var(--gap);
}

.doc-item{
  display:flex;
  gap:20px;
  height:100%;
  padding:18px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--bg-card);
  transition:background .2s ease, border-color .2s ease, box-shadow .2s ease, border-width .2s ease;
  cursor:pointer;
}

.doc-item:hover{
  background:var(--bg-hover);
  border-color:#6B5045;
  box-shadow:0 10px 36px rgba(62,56,54,0.14);
}

.doc-thumb{
  flex:0 0 auto;
  width:120px;
  height:150px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--bg-thumb);
  overflow:hidden;
  perspective:600px;
}

.thumb-flipper{
  position:relative;
  width:100%;
  height:100%;
  transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  transform-style:preserve-3d;
}

.doc-item:hover .doc-thumb .thumb-flipper{
  transform:rotateY(180deg);
}

.thumb-front,
.thumb-back{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.thumb-front{
  background:var(--bg-thumb);
  padding:12px;
}

.thumb-back{
  transform:rotateY(180deg);
  background:#fff;
}

.thumb-back img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
}

.thumb-badge{
  font-size:11px;
  font-weight:600;
  color:var(--primary);
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.thumb-icon{
  width:34px;
  height:42px;
  border:1.5px solid var(--primary);
  border-radius:3px;
  position:relative;
  opacity:0.55;
}
.thumb-icon::after{
  content:"";
  position:absolute;
  top:6px;
  left:6px;
  right:6px;
  height:2px;
  background:var(--primary);
  box-shadow:0 6px 0 var(--primary), 0 12px 0 var(--primary), 0 18px 0 var(--primary);
}

.view-btn{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.92);
  border:1px solid var(--border);
  color:var(--primary);
  font-size:11px;
  font-weight:500;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .2s ease;
  box-shadow:0 2px 8px rgba(62,56,54,0.08);
  white-space:nowrap;
}

.doc-item:hover .view-btn{
  opacity:1;
  pointer-events:auto;
}

.doc-content{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.doc-title{
  font-size:18px;
  font-weight:600;
  color:var(--text-main);
  line-height:1.35;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.doc-meta{
  font-size:13px;
  color:var(--text-secondary);
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.doc-meta .divider{
  margin:0 5px;
  color:var(--border-hover);
}

.doc-abstract{
  font-size:13px;
  color:var(--text-secondary);
  line-height:1.6;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.doc-keywords{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
  padding-top:4px;
}

.keyword{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:var(--bg-chip);
  color:var(--primary);
  font-size:12px;
}

.empty-state{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  text-align:center;
  color:var(--text-secondary);
}

.empty-state.visible{ display:flex; }

.empty-icon{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--bg-chip);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin-bottom:16px;
  color:var(--primary);
}

.empty-title{
  font-size:16px;
  font-weight:600;
  color:var(--text-main);
  margin:0 0 6px;
}

.empty-desc{
  font-size:14px;
  margin:0;
}

.back-to-top{
  position:fixed;
  right:32px;
  bottom:32px;
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  background:#C7A18E;
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:opacity .25s ease, visibility .25s ease, transform .25s ease, background .2s ease, box-shadow .2s ease;
  box-shadow:0 4px 14px rgba(62,56,54,0.12);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-to-top.visible{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.back-to-top:hover{
  background:#B08D7B;
  box-shadow:0 6px 18px rgba(62,56,54,0.16);
}

@media (max-width:720px){
  .back-to-top{
    right:20px;
    bottom:20px;
    width:40px;
    height:40px;
  }
}

@media (max-width:1100px){
  .doc-grid{
    grid-template-columns:minmax(0, 1fr);
  }
  .doc-abstract{
    -webkit-line-clamp:3;
  }
}

@media (max-width:720px){
  .library-shell{
    padding:24px 20px 48px;
  }
  .doc-item{
    flex-direction:column;
    gap:16px;
  }
  .doc-thumb{
    width:100%;
    height:170px;
  }
}
</style>
</head>

      </div>
      <div class="doc-content">
        <h3 class="doc-title">${doc.title}</h3>
        <p class="doc-meta">
          ${doc.source} <span class="divider">·</span> ${doc.year} <span class="divider">·</span> ${doc.authors}
        </p>
        <p class="doc-abstract">${doc.abstract}</p>
        <div class="doc-keywords">
          ${doc.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}
        </div>
      </div>
    </article>
  `;
}

function filterDocs(){
  const q = currentQuery.trim().toLowerCase();
  return documents.filter(doc => {
    return !q ||
      doc.title.toLowerCase().includes(q) ||
      doc.authors.toLowerCase().includes(q) ||
      doc.source.toLowerCase().includes(q) ||
      doc.keywords.some(k => k.toLowerCase().includes(q));
  });
}

function render(){
  const filtered = filterDocs();
  resultCount.textContent = filtered.length;

  if(filtered.length === 0){
    grid.innerHTML = '';
    emptyState.classList.add('visible');
  } else {
    grid.innerHTML = filtered.map(renderDoc).join('');
    emptyState.classList.remove('visible');
  }
}

searchInput.addEventListener('input', e => {
  currentQuery = e.target.value;
  render();
});

const backToTop = document.getElementById('backToTop');

document.addEventListener('mouseover', e => {
  if(e.target.closest('.doc-item')){
    document.documentElement.classList.remove('scroll-medium');
  } else {
    document.documentElement.classList.add('scroll-medium');
  }
});

document.addEventListener('mouseout', e => {
  if(!e.relatedTarget || !e.relatedTarget.closest('.doc-item')){
    document.documentElement.classList.remove('scroll-medium');
  }
});

function toggleBackToTop(){
  if(window.scrollY > window.innerHeight * 0.5){
    backToTop.classList.add('visible');
  } else {
    backToTop.classList.remove('visible');
  }
}

window.addEventListener('scroll', toggleBackToTop, { passive: true });

backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

grid.addEventListener('click', e => {
  const item = e.target.closest('.doc-item');
  if(!item) return;
  const pdf = item.dataset.pdf;
  if(pdf){
    window.open(pdf, '_blank');
  }
});

render();
</script>
</body>
</html>
