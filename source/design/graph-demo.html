<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫传腹因果图谱 · 宠医助手</title>
<script src="https://unpkg.com/@antv/g6@4.8.24/dist/g6.min.js"></script>
<style>
:root{
  --color-primary-900:#6B5045;
  --color-primary-700:#8C6B5D;
  --color-primary-500:#C7A18E;
  --color-primary-100:#FAF3EC;
  --color-text-main:#3E3836;
  --color-text-secondary:#6F6763;
  --color-border:#EDE5DD;
  --color-surface:#FDFBF7;
  --color-card:#FFFFFF;
  --color-header:#FFF9F5;
  --shadow-xs:0 1px 2px rgba(62,56,54,0.04);
  --shadow-sm:0 4px 12px rgba(62,56,54,0.06);
  --shadow-md:0 8px 24px rgba(62,56,54,0.10);
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color:var(--color-text-main);background:var(--color-surface);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ============ 整体三栏 ============ */
.app-shell{display:flex;height:100vh;width:100vw;}

/* ============ 左侧导航 ============ */
.left-nav{
  width:280px;min-width:280px;background:var(--color-card);
  border-right:1px solid var(--color-border);
  display:flex;flex-direction:column;padding:20px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
.brand-logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#FAF3EC 0%,#F4F7F1 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--color-primary-700);
}
.brand-title{font-size:16px;font-weight:600;color:var(--color-text-main);}
.brand-subtitle{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.new-task-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:10px 14px;border:none;border-radius:var(--radius-sm);
  background:var(--color-primary-700);color:#fff;font-size:14px;font-weight:500;
  cursor:pointer;margin-bottom:16px;
}
.new-task-btn:hover{background:var(--color-primary-900);}
.nav-menu{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--radius-sm);color:var(--color-text-secondary);
  font-size:14px;cursor:pointer;text-decoration:none;
  transition:background .18s ease,color .18s ease;
}
.nav-item:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
.nav-item.active{background:var(--color-primary-100);color:var(--color-primary-900);font-weight:500;}
.nav-item .nav-ico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
.nav-item.active .nav-ico{color:var(--color-primary-700);}
.nav-section{margin-top:20px;}
.nav-section-title{
  font-size:11px;color:var(--color-text-secondary);padding:0 12px;
  margin-bottom:6px;letter-spacing:.5px;
}
.recent-item{
  display:flex;align-items:center;gap:10px;padding:7px 12px;
  border-radius:var(--radius-sm);font-size:13px;color:var(--color-text-secondary);cursor:pointer;
}
.recent-item:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
.recent-dot{width:6px;height:6px;border-radius:50%;background:var(--color-primary-500);flex:none;}

/* ============ 中间图谱区 ============ */
.graph-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--color-surface);position:relative;}
.graph-header{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;gap:16px;flex:none;
}
.graph-title{font-size:20px;font-weight:600;color:var(--color-text-main);white-space:nowrap;}
/* 图例：画布横向精确居中 */
.legend{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:none;
}
.legend-item{display:flex;align-items:center;gap:6px;height:20px;font-size:12px;color:var(--color-text-secondary);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto;}
.ghost-btn{
  display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;line-height:1;border:none;background:transparent;
  color:var(--color-text-secondary);font-size:13px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .18s ease,color .18s ease;
}
.ghost-btn:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
.ghost-btn.active{background:var(--color-primary-100);color:var(--color-primary-900);}
.graph-canvas{
  flex:1;position:relative;
  background-color:var(--color-surface);
  background-image:radial-gradient(circle, rgba(237,229,221,0.35) 1px, transparent 1px);
  background-size:22px 22px;
  margin:0 8px 8px;border-radius:var(--radius-lg);
  border:1px solid var(--color-border);
  overflow:hidden;
}
#graph-container{width:100%;height:100%;}
/* 图谱缩略图（G6 Minimap）：左下角 138×92（宽 3/5 · 高 2/5），委托渲染 */
.g6-minimap{
  position:absolute!important;left:16px!important;bottom:16px!important;
  top:auto!important;right:auto!important;width:138px!important;height:92px!important;
  background:rgba(253,251,247,0.92)!important;border:1px solid #EDE5DD!important;
  border-radius:8px!important;box-shadow:var(--shadow-sm)!important;
  overflow:hidden;z-index:5;backdrop-filter:blur(4px);
}
.g6-minimap svg{border-radius:7px;display:block;}
/* 视口窗口框：覆盖 G6 默认蓝色 outline 为暖灰 #6F6763 */
.g6-minimap-viewport{outline:2px solid #6F6763!important;}
.path-banner{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;
  background:var(--color-card);border:1px solid var(--color-border);
  border-radius:var(--radius-pill);padding:6px 8px 6px 14px;
  box-shadow:var(--shadow-sm);z-index:10;
}
.path-banner.show{display:flex;}
.path-banner .path-tag{
  font-size:12px;color:var(--color-primary-900);background:var(--color-primary-100);
  padding:2px 8px;border-radius:var(--radius-pill);font-weight:500;
}
.path-banner .path-info{font-size:12px;color:var(--color-text-secondary);}
.path-banner button{
  border:none;background:var(--color-primary-100);color:var(--color-primary-900);
  font-size:12px;padding:5px 12px;border-radius:var(--radius-pill);cursor:pointer;
}
.path-banner button:hover{background:var(--color-primary-500);color:#fff;}

/* ============ 右侧详情面板（抽屉样式，覆盖画布不挤压） ============ */
.app-shell{position:relative;}
.right-panel{
  position:absolute;top:0;right:0;bottom:0;width:380px;
  background:var(--color-card);
  border-left:1px solid var(--color-border);
  box-shadow:-6px 0 20px rgba(62,56,54,0.10);
  transform:translateX(100%);
  transition:transform .25s ease;
  z-index:20;
  display:flex;flex-direction:column;overflow-y:auto;
}
.right-panel.show{transform:translateX(0);}
.panel-close{
  position:absolute;top:12px;right:12px;z-index:5;
  width:28px;height:28px;border:none;border-radius:6px;
  background:transparent;color:var(--color-text-secondary);
  font-size:16px;line-height:1;cursor:pointer;
}
.panel-close:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
.panel-back{
  position:absolute;top:12px;left:12px;z-index:5;
  width:28px;height:28px;border:none;border-radius:6px;
  background:transparent;color:var(--color-text-secondary);
  font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;   /* svg 图标在按钮内居中 */
}
.panel-back:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
.badge-detail{padding:48px 24px 24px;display:flex;flex-direction:column;gap:16px;}
.right-panel .node-detail,.right-panel .edge-detail{padding-top:48px;}
.panel-empty{
  padding:32px 24px;display:flex;flex-direction:column;gap:24px;
}
.panel-empty-hint{text-align:center;color:var(--color-text-secondary);font-size:13px;padding-top:12px;}
.panel-empty-hint .big{font-size:16px;color:var(--color-text-main);margin-bottom:6px;}
.legend-block{}
.legend-block-title{
  font-size:12px;color:var(--color-text-secondary);font-weight:500;
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--color-border);
}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-main);margin-bottom:8px;}
.legend-swatch{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.legend-swatch svg{display:block;}
.legend-badge{
  font-size:11px;font-weight:500;padding:1px 8px;border-radius:var(--radius-pill);color:#fff;
}
/* 节点详情 */
.node-detail{padding:24px;display:flex;flex-direction:column;gap:20px;}
.node-head{display:flex;flex-direction:column;gap:10px;}
.type-tag{
  align-self:flex-start;font-size:12px;font-weight:500;
  padding:3px 12px;border-radius:var(--radius-pill);
}
.node-title{font-size:20px;font-weight:600;color:var(--color-text-main);line-height:1.4;}
.node-meta{display:flex;gap:0;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;}
.meta-cell{flex:1;padding:12px 8px;text-align:center;border-right:1px solid var(--color-border);}
.meta-cell:last-child{border-right:none;}
.meta-num{font-size:18px;font-weight:600;color:var(--color-text-main);}
.meta-label{font-size:11px;color:var(--color-text-secondary);margin-top:3px;}
.section-title{font-size:13px;font-weight:600;color:var(--color-text-main);}
.rel-list{display:flex;flex-direction:column;gap:10px;}
.rel-item{
  position:relative;border:1px solid var(--color-border);border-radius:var(--radius-md);
  padding:12px 14px 12px 17px;cursor:pointer;transition:box-shadow .18s ease;
  background:var(--color-card);
}
.rel-item:hover{box-shadow:var(--shadow-sm);}
.rel-item::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:2px;background:var(--rel-color,#8C6B5D);
}
.rel-top{display:flex;align-items:center;margin-bottom:6px;}
.rel-direction{font-size:13px;color:var(--color-text-main);font-weight:500;margin-bottom:4px;}
.rel-direction .arrow{color:var(--color-text-secondary);margin:0 4px;font-weight:400;}
.rel-evidence{font-size:12px;color:var(--color-text-secondary);line-height:1.6;}
.rel-flags{display:flex;align-items:center;gap:6px;}
.pol-dot{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.pol-dot svg{display:block;}
.pol-text{font-size:11px;color:var(--color-text-secondary);}
.conf-badge{font-size:11px;font-weight:500;padding:1px 8px;border-radius:var(--radius-pill);color:#fff;cursor:pointer;}
/* 关系详情 */
.edge-detail{padding:24px;display:flex;flex-direction:column;gap:18px;}
.edge-rel-label{font-size:20px;font-weight:600;color:var(--color-text-main);line-height:1.4;}   /* 与一级页面 node-title 一致 */
.edge-path{
  font-size:13px;color:var(--color-text-main);line-height:1.5;
  padding:12px 14px;background:var(--color-surface);border-radius:var(--radius-md);
}
.edge-path .arrow{color:var(--color-text-secondary);margin:0 6px;}
.kv-row{display:flex;align-items:center;gap:12px;font-size:13px;}
.kv-label{color:var(--color-text-secondary);width:56px;flex:none;}
.evidence-box{
  font-size:13px;color:var(--color-text-main);line-height:1.7;
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-md);padding:14px 16px;
}
.evidence-box .ev-title{font-size:12px;color:var(--color-text-secondary);margin-bottom:8px;}

/* ============ 3D 全屏覆盖层 ============ */
.graph-3d-overlay{
  position:fixed;inset:0;z-index:1000;
  background:var(--color-surface);
  display:none;flex-direction:column;
}
.graph-3d-overlay.show{display:flex;}
.graph-3d-toolbar{
  position:absolute;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:16px;
  justify-content:space-between;
  padding:16px 24px;pointer-events:none;   /* 与 2D header padding 一致，标题位置对齐 */
  background:linear-gradient(180deg, rgba(253,251,247,0.95) 60%, rgba(253,251,247,0));
}
.graph-3d-toolbar > *{pointer-events:auto;}
.graph-3d-title{font-size:20px;font-weight:600;color:var(--color-text-main);}
/* 图例：画布横向精确居中（与 2D 一致） */
.graph-3d-legend{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:none;   /* gap 与 2D legend 一致 */
}
/* 返回 2D 按钮：与 2D 的 ghost-btn（3D/演示路径）样式一致，无边框透明底 */
.graph-3d-exit{color:var(--color-text-secondary);}
.graph-3d-exit:hover{background:var(--color-primary-100);color:var(--color-primary-900);}
#graph3d-container{flex:1;width:100%;height:100%;}
/* 只隐藏 three-forcegraph 库的英文操作提示（navInfo 有固定 class scene-nav-info）；
   不能用容器子元素选择器（会连 renderer 挂载 div 一起隐藏导致图不渲染） */
#graph3d-container .scene-nav-info{display:none!important;}
/* 3D 加载提示：纯文字（无外框），画布中央，不拦截交互；位于 overlay 层，不影响 graph3d-container 内部结构 */
.graph-3d-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:12;
  font-size:14px;color:var(--color-text-secondary);pointer-events:none;white-space:nowrap;
}
.graph-3d-info{
  position:absolute;top:72px;right:20px;z-index:11;width:300px;max-height:calc(100vh - 100px);
  overflow-y:auto;background:var(--color-card);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:18px;
  display:none;
}
.graph-3d-info.show{display:block;}
.graph-3d-info .close{
  position:absolute;top:10px;right:12px;border:none;background:transparent;
  color:var(--color-text-secondary);cursor:pointer;font-size:16px;
}
.graph-3d-hint{
  position:absolute;bottom:14px;right:24px;z-index:10;   /* 靠右，与 toolbar padding 对齐 */
  font-size:12px;color:var(--color-text-secondary);
  background:var(--color-card);border:1px solid var(--color-border);
  border-radius:var(--radius-pill);padding:6px 14px;box-shadow:var(--shadow-xs);
  pointer-events:none;
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- 中间图谱 -->
  <main class="graph-main" id="graphMain">
    <header class="graph-header">
      <div class="graph-title">猫传腹因果图谱</div>
      <div class="legend" id="typeLegend"></div>
      <div class="header-actions">
        <button class="ghost-btn" id="demoPathBtn">◈ 演示路径</button>
        <button class="ghost-btn" id="btn3d">◍ 3D</button>
      </div>
    </header>
    <div class="graph-canvas" id="graphCanvas">
      <div id="graph-container"></div>
      <div class="path-banner" id="pathBanner">
        <span class="path-tag">推理链高亮</span>
        <span class="path-info" id="pathInfo"></span>
        <button id="exitPathBtn">退出高亮</button>
      </div>
    </div>
  </main>

  <!-- 右侧详情 -->
  <aside class="right-panel" id="rightPanel"></aside>
</div>

<!-- 3D 全屏覆盖层 -->
<div class="graph-3d-overlay" id="graph3dOverlay">
  <div class="graph-3d-toolbar">
    <div class="graph-3d-title">猫传腹因果图谱</div>
    <div class="graph-3d-legend" id="graph3dLegend"></div>
    <button class="ghost-btn graph-3d-exit" id="btn3dExit">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回 2D
    </button>
  </div>
  <div id="graph3d-container"></div>
  <div class="graph-3d-loading" id="graph3dLoading">正在渲染3D组件，请稍后...</div>
  <div class="graph-3d-info" id="graph3dInfo"></div>
  <div class="graph-3d-hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击节点查看详情</div>
</div>

/* 向心压缩：以「湿性猫传染性腹膜炎（湿性FIP）」所在簇为锚点，外围簇向中心簇靠拢
   R0：簇半径阈值（簇内节点不动）；K：压缩系数（越小越紧凑：0=全压到 R0，1=不变） */
(function(){
  const hub = '湿性猫传染性腹膜炎（湿性FIP）';
  const members = [hub];
  GRAPH_DATA.edges.forEach(e=>{
    if(e.source===hub) members.push(e.target);
    if(e.target===hub) members.push(e.source);
  });
  const valid = members.filter(id => GRAPH_COORDS[id]);
  const ax = valid.reduce((s,id)=>s+GRAPH_COORDS[id].x,0) / valid.length;
  const ay = valid.reduce((s,id)=>s+GRAPH_COORDS[id].y,0) / valid.length;
  const R0 = 500, K = 0.5;
  Object.values(GRAPH_COORDS).forEach(p=>{
    if(typeof p.x !== 'number') return;
    const dx = p.x - ax, dy = p.y - ay;
    const d = Math.hypot(dx, dy);
    if(d > R0){
      const s = (R0 + (d - R0) * K) / d;
      p.x = ax + dx * s;
      p.y = ay + dy * s;
    }
  });
})();
const NODES = GRAPH_DATA.nodes.map(n => ({ ...n, nodeType:n.type, x:(GRAPH_COORDS[n.id]||{}).x, y:(GRAPH_COORDS[n.id]||{}).y }));

function charW(ch){ return ch.charCodeAt(0) > 255 ? 12 : 7; }
function splitLabel(label){
  const chars = [...label];
  const totalW = chars.reduce((s,ch)=>s+charW(ch),0);
  if(totalW <= 108) return [label];
  let w=0, cut=chars.length;
  const target = totalW/2;
  for(let i=0;i<chars.length;i++){ w+=charW(chars[i]); if(w>=target){cut=i+1;break;} }
  return [chars.slice(0,cut).join(''), chars.slice(cut).join('')];
}

function clearNodeStates(){
  ['selected','hover','dim','dim2'].forEach(s=>{
    NODES.forEach(n=>{ const it=graph.findById(n.id); if(it) graph.setItemState(it, s, false); });
  });
}
function resetEdges(){
  gEdges.forEach(e=>{
    const it=graph.findById(e.id); if(!it) return;
    const col = EDGE_COLOR;
    const eOpacity = CONFIDENCE_OPACITY[e.confidence] || 1;
    graph.updateItem(it, {
      label:'',
      style:{ stroke:col, lineWidth:1.8, opacity:eOpacity,
        endArrow:{ path:G6.Arrow.triangle(6,8,0), fill:col, opacity:eOpacity } },
    });
  });
}
function styleEdge(eid, {opacity, lineWidth, showLabel, color}){
  const it=graph.findById(eid); if(!it) return;
  const e=edgeById[eid];
  const col = color || EDGE_COLOR;
  // 焦点边（opacity=1）：叠加置信度不透明度；弱化边（opacity<1）：保持弱化值
  const effOpacity = opacity >= 1 ? (CONFIDENCE_OPACITY[e.confidence] || 1) : opacity;
  const labColor = showLabel ? (CONFIDENCE_COLORS[e.confidence]||'#6F6763') : '#6F6763';
  graph.updateItem(it, {
    label: showLabel ? (e.rel+' · '+e.confidence) : '',
    labelCfg:{ style:{ fill:labColor, fontSize:11, background:{ fill:'#FFFFFF', padding:[2,6,2,6], radius:4 } } },
    style:{ stroke:col, lineWidth, opacity:effOpacity,
      endArrow:{ path:G6.Arrow.triangle(6,8,0), fill:col, opacity:effOpacity } },
  });
}

function applyFocus(activeId, isSelected){
  if(!activeId){ clearNodeStates(); resetEdges(); return; }
  const nb1 = neighborMap[activeId];
  const nb2 = new Set();
  if(isSelected){ nb1.forEach(x=>neighborMap[x].forEach(y=>{ if(y!==activeId) nb2.add(y); })); }
  const keepEdges = new Set();   // 直接边
  const midEdges = new Set();    // 二度边
  NODES.forEach(n=>{
    const it=graph.findById(n.id); if(!it) return;
    ['selected','hover','dim','dim2'].forEach(s=>graph.setItemState(it,s,false));
    if(n.id===activeId){
      graph.setItemState(it, isSelected?'selected':'hover', true);
    } else if(nb1.has(n.id)){
      // 一度邻居：保持
    } else if(isSelected && nb2.has(n.id)){
      graph.setItemState(it,'dim2',true);
    } else {
      graph.setItemState(it,'dim',true);
    }
  });
  EDGES.forEach(e=>{
    const isDirect = e.source===activeId || e.target===activeId;
    if(isDirect){
      keepEdges.add(e.id); styleEdge(e.id,{opacity:1,lineWidth:3,showLabel:true});
    } else {
      const bothNear = nb1.has(e.source) && nb1.has(e.target);
      if(isSelected && bothNear){ midEdges.add(e.id); styleEdge(e.id,{opacity:0.35,lineWidth:1.8,showLabel:false}); }
      else styleEdge(e.id,{opacity:0.15,lineWidth:1.5,showLabel:false});
    }
  });
}

function clearFocus(){
  hoverNodeId=null; selectedNodeId=null; selectedEdgeId=null;
  if(!pathMode){ clearNodeStates(); resetEdges(); }
  else { applyPathMode(pathNodes, true); }
}

function selectEdge(id){
  selectedEdgeId=id; selectedNodeId=null; hoverNodeId=null;
  const e=edgeById[id];
  // 边高亮：该边最高层级，两端节点清晰，其余弱化
  const keepNodes = new Set([e.source, e.target]);
  NODES.forEach(n=>{
    const it=graph.findById(n.id); if(!it) return;
    ['selected','hover','dim','dim2'].forEach(s=>graph.setItemState(it,s,false));
    if(keepNodes.has(n.id)) graph.setItemState(it,'hover',true);
    else graph.setItemState(it,'dim',true);
  });
  EDGES.forEach(ee=>{
    if(ee.id===id) styleEdge(ee.id,{opacity:1,lineWidth:3.75,showLabel:true});
    else styleEdge(ee.id,{opacity:0.15,lineWidth:1.5,showLabel:false});
  });
  renderEdgeDetail(id);
}

/* ============ 路径高亮 ============ */
let pathNodes=[];
function applyPathMode(nodes, keep){
  pathNodes=nodes; pathMode=true;
  const seq = nodes.map((n,i)=>({n, idx:i}));
  const pos = {}; seq.forEach((s,i)=>pos[s.n]=i);
  const pathSet = new Set(nodes);
  // 路径上的边：相邻节点之间
  const pathEdgeIds = new Set();
  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i], b=nodes[i+1];
    const eid1=a+'||'; // 前缀匹配找边
    EDGES.forEach(e=>{
      if((e.source===a&&e.target===b)||(e.source===b&&e.target===a)) pathEdgeIds.add(e.id);
    });
  }
  NODES.forEach(n=>{
    const it=graph.findById(n.id); if(!it) return;
    ['selected','hover','dim','dim2'].forEach(s=>graph.setItemState(it,s,false));
    if(pathSet.has(n.id)) graph.setItemState(it,'selected',true);
    else graph.setItemState(it,'dim',true);
  });
  EDGES.forEach(e=>{
    if(pathEdgeIds.has(e.id)) styleEdge(e.id,{opacity:1,lineWidth:3.75,showLabel:true});
    else styleEdge(e.id,{opacity:0.12,lineWidth:1.5,showLabel:false});
  });
  document.getElementById('pathBanner').classList.add('show');
  document.getElementById('pathInfo').textContent = nodes.length+' 个节点 · '+(nodes.length-1)+' 条关系';
  // 聚焦到路径
  setTimeout(()=>{
    const items = nodes.map(id=>graph.findById(id)).filter(Boolean);
    if(items.length) graph.focusItems ? graph.focusItems(items, false, { ratio:0.55 }) : graph.fitView(30);
  }, 60);
}
function exitPathMode(){
  pathMode=false; pathNodes=[];
  document.getElementById('pathBanner').classList.remove('show');
  clearFocus();
}

/* ============ 3D 模式（全屏覆盖） ============ */
let g3d = null;
let spriteTextLib = null;
const g3dOverlay = document.getElementById('graph3dOverlay');
const g3dInfo = document.getElementById('graph3dInfo');

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('加载失败: ' + src));
    document.head.appendChild(s);
  });
}

async function enter3D(){
  g3dOverlay.classList.add('show');
  const loadingEl = document.getElementById('graph3dLoading');
  if (loadingEl) loadingEl.style.display = 'block';
  try{
    if(!window.ForceGraph3D){
      await loadScript('https://unpkg.com/3d-force-graph@1.80.0/dist/3d-force-graph.min.js');
    }
    if(!spriteTextLib){
      spriteTextLib = await import('https://esm.sh/three-spritetext');
    }
    init3D();
  }catch(err){
    g3dOverlay.classList.remove('show');
    if (loadingEl) loadingEl.style.display = 'none';
    alert('3D 组件加载失败：' + err.message);
  }
}

function init3D(){
  const SpriteText = (spriteTextLib && spriteTextLib.default) || spriteTextLib;
  const el = document.getElementById('graph3d-container');
  const gData = {
    nodes: GRAPH_DATA.nodes.map(n => ({ id:n.id, label:n.label, type:n.type })),
    links: GRAPH_DATA.edges.map(e => ({
      source:e.source, target:e.target, rel:e.rel,
      polarity:e.polarity, confidence:e.confidence, evidence:e.evidence,
    })),
  };
  g3d = ForceGraph3D()(el);
  g3d
    .backgroundColor('#FDFBF7')
    .graphData(gData)
    .nodeColor(d => (TYPE_STYLES[d.type] || TYPE_STYLES['机制与过程']).main)
    .nodeVal(6)
    .nodeThreeObject(node => {
      const sprite = new SpriteText(node.label);
      sprite.material.depthWrite = false;
      sprite.material.depthTest = false;
      sprite.color = (TYPE_STYLES[node.type] || TYPE_STYLES['机制与过程']).main;
      sprite.textHeight = 6;
      sprite.center.y = -1.9;   // 标签上移到球体上方
      return sprite;
    })
    .nodeThreeObjectExtend(true)
    .nodeLabel(d => d.label + ' · ' + d.type)
    .linkColor(l => POLARITY_COLORS[l.polarity] || '#8C8C8C')
    .linkWidth(l => l.confidence === 'High' ? 1.6 : 1)
    .linkOpacity(0.55)
    .linkDirectionalArrowLength(3.5)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalParticles(1)
    .linkLabel(l => l.rel + ' · ' + l.confidence)
    .onNodeClick(node => show3dInfo('node', node))
    .onLinkClick(link => show3dInfo('link', link))
    .onBackgroundClick(() => hide3dInfo());
  g3d.d3Force('charge').strength(-140);
  g3d.d3Force('link').distance(68);
  g3d.cameraPosition({ x:0, y:0, z:700 });
  render3dLegend();
  // 渲染完成（力导向引擎停止）后隐藏加载提示；setTimeout 兜底（onEngineStop 为回调注册，不覆盖渲染循环，安全）
  const hideLoading = () => {
    const le = document.getElementById('graph3dLoading');
    if (le) le.style.display = 'none';
  };
  try {
    if (typeof g3d.onEngineStop === 'function') g3d.onEngineStop(hideLoading);
  } catch(e) {}
  setTimeout(hideLoading, 6000);
  // 继承 2D 的路径高亮
  if(pathMode && pathNodes.length >= 2){
    setTimeout(()=>{
      const inPath = new Set(pathNodes);
      g3d.nodeColor(d => inPath.has(d.id) ? (TYPE_STYLES[d.type] || TYPE_STYLES['机制与过程']).main : '#EDE5DD');
      g3d.linkVisibility(l => inPath.has(l.source.id) && inPath.has(l.target.id));
    }, 80);
  }
}

function exit3D(){
  if(g3d){ try{ g3d._destructor(); }catch(e){} g3d = null; }
  g3dOverlay.classList.remove('show');
  hide3dInfo();
  document.getElementById('graph3d-container').innerHTML = '';
}

function render3dLegend(){
  const el = document.getElementById('graph3dLegend');
  el.innerHTML = Object.keys(TYPE_STYLES).map(t=>{
    const c = TYPE_STYLES[t];
    return '<span class="legend-item"><span class="legend-dot" style="background:'+c.main+'"></span>'+t+'</span>';
  }).join('');
}

function show3dInfo(kind, obj){
  const el = g3dInfo;
  if(kind === 'node'){
    const c = TYPE_STYLES[obj.type] || TYPE_STYLES['机制与过程'];
    const d = degree[obj.id];
    const rels = edgesOf[obj.id].map(eid => edgeById[eid]);
    el.innerHTML =
      '<button class="close" onclick="hide3dInfo()">✕</button>'+
      '<div class="node-title" style="font-size:17px;margin:0 0 10px;">'+obj.label+'</div>'+
      '<span class="type-tag" style="background:'+c.light+';color:'+c.main+';border:1px solid '+c.border+'">'+obj.type+'</span>'+
      '<div class="node-meta">'+
        '<div class="meta-cell"><div class="meta-num">'+d.out+'</div><div class="meta-label">出度</div></div>'+
        '<div class="meta-cell"><div class="meta-num">'+d.in+'</div><div class="meta-label">入度</div></div>'+
        '<div class="meta-cell"><div class="meta-num">'+rels.length+'</div><div class="meta-label">关联</div></div>'+
      '</div>'+
      '<div class="section-title" style="margin:14px 0 8px;">关联关系</div>'+
      '<div class="rel-list">'+rels.slice(0,12).map(eid=>{
        const e = edgeById[eid];
        const out = e.source === obj.id;
        const other = out ? e.target : e.source;
        return '<div class="rel-item" style="--rel-color:'+(TYPE_STYLES[nodeById[other].type]||TYPE_STYLES['机制与过程']).main+'">'+
          '<div class="rel-top"><div class="rel-direction">'+other+'</div>'+
          '<div class="rel-flags"><span class="pol-dot">'+polIcon(e.polarity)+'</span>'+confBadge(e.confidence)+'</div></div>'+
          '<div class="rel-evidence">'+e.rel+' · '+e.evidence+'</div></div>';
      }).join('')+'</div>';
  } else {
    const e = obj;
    const s = e.source, t = e.target;
    const sc = TYPE_STYLES[s.type] || TYPE_STYLES['机制与过程'];
    const tc = TYPE_STYLES[t.type] || TYPE_STYLES['机制与过程'];
    el.innerHTML =
      '<button class="close" onclick="hide3dInfo()">✕</button>'+
      '<div class="edge-rel-label" style="font-size:17px;">'+e.rel+'</div>'+
      '<div class="edge-path" style="margin-top:12px;">'+
        '<span style="color:'+sc.main+'">'+s.label+'</span>'+
        '<span class="arrow">→</span>'+
        '<span style="color:'+tc.main+'">'+t.label+'</span></div>'+
      '<div class="kv-row" style="margin-top:12px;"><span class="kv-label">极性</span>'+
        '<span class="pol-dot">'+polIcon(e.polarity)+'</span>'+
        '<span style="margin-left:6px;">'+POLARITY_TEXT[e.polarity]+'</span></div>'+
      '<div class="kv-row" style="margin-top:8px;"><span class="kv-label">置信度</span>'+confBadge(e.confidence)+'</div>'+
      '<div class="evidence-box" style="margin-top:12px;"><div class="ev-title">支撑依据</div>'+e.evidence+'</div>';
  }
  el.classList.add('show');
}

function hide3dInfo(){
  g3dInfo.classList.remove('show');
}

document.getElementById('btn3d').addEventListener('click', enter3D);
document.getElementById('btn3dExit').addEventListener('click', exit3D);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && g3dOverlay.classList.contains('show')) exit3D();
});

/* ============ 初始化 ============ */
renderTypeLegend();
readUrlPath();
</script>
</body>
</html>
